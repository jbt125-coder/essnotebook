<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESS Notebook">
<title>Earth Space Science Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#0D1B2A; --sky2:#12253A; --panel:#172C44; --panel2:#1E3653; --line:#2B4765;
  --ice:#9AD9EA; --amber:#F4B860; --text:#E8EEF5; --muted:#97A9BF; --done:#86D4A9;
  --head:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--sky);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--sky);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--head);margin:0;line-height:1.15}
p{margin:0 0 .8em}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:8px}
.view{display:none}
.view.on{display:block}

/* Title */
#title{position:relative;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
#title.on{display:flex;flex-direction:column}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff}
.star.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.earth{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;max-height:260px;pointer-events:none;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.title-inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(30vh + 24px);max-width:520px;width:100%;margin:0 auto}
.title-inner h1{font-weight:800;font-size:clamp(2.4rem,11vw,3.8rem);letter-spacing:-.02em;line-height:.98;margin-bottom:14px}
.title-inner h1 span{display:block;font-weight:600;font-size:.52em;letter-spacing:0;color:var(--ice);margin-top:10px}
.lede{color:var(--muted);margin-bottom:26px}
.picker{display:flex;gap:10px}
.select-wrap{position:relative;flex:1}
.select-wrap::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2px solid var(--ice);border-bottom:2px solid var(--ice);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{width:100%;appearance:none;-webkit-appearance:none;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 40px 14px 16px;font-size:17px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:700;cursor:pointer;background:var(--amber);color:#1A1306}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ice);border:1.5px solid var(--line)}
.btn.wide{width:100%;padding:16px;font-size:18px}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;cursor:pointer;font-size:15px}
.title-foot{position:relative;z-index:1;text-align:center;padding-bottom:10px}

/* Page chrome */
.page{max-width:680px;margin:0 auto;padding:12px 20px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 18px}
.back{background:none;border:0;color:var(--ice);font-weight:700;padding:8px 4px;cursor:pointer;font-size:16px}
.back::before{content:"‹ ";font-size:1.2em}
.crumb{color:var(--muted);font-size:14px}

/* Contents */
.toc-head h2{font-size:clamp(1.9rem,8vw,2.6rem);font-weight:800;letter-spacing:-.01em}
.toc-head p{color:var(--muted);margin-top:6px}
.meter{height:6px;background:var(--panel);border-radius:6px;margin:16px 0 10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--done);border-radius:6px;transition:width .5s}
.hint{color:var(--muted);font-size:14px;margin:0 0 16px}
.toc{list-style:none;margin:0;padding:0;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.toc li{margin-bottom:12px;position:relative}
.toc li.lifted{z-index:5}
.toc li.lifted button{border-color:var(--amber);background:var(--panel2);box-shadow:0 14px 30px rgba(0,0,0,.45);transform:scale(1.02)}
.toc button{width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.toc svg{width:56px;height:56px;display:block}
.toc h3{font-size:1.15rem;font-weight:600}
.toc p{color:var(--muted);font-size:15px;margin:2px 0 0;line-height:1.4}
.status{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.status.done{color:var(--done)}
.reset-row{text-align:center;margin-top:6px}
body.dragging{cursor:grabbing}

/* Cards */
.card-hero{background:var(--sky2);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin:0 0 22px}
.card-hero svg{width:100%;height:auto;display:block}
.card-hero figcaption{color:var(--muted);font-size:14px;margin-top:10px}
.card h2{font-size:clamp(1.9rem,8vw,2.5rem);font-weight:800;letter-spacing:-.01em;margin-bottom:12px}
.card h3{font-size:1.3rem;font-weight:600;margin:30px 0 10px;color:var(--ice)}
.card .intro{font-size:1.1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.tile svg{width:58px;height:58px;display:block;margin-bottom:8px}
.tile h4{font-size:1.05rem;font-weight:600;margin-bottom:4px}
.tile p{font-size:14.5px;line-height:1.45;color:#C9D5E3;margin:0 0 8px}
.tile p:last-child{margin-bottom:0}
.chip{display:inline-block;font-size:12.5px;font-weight:700;color:var(--ice);background:rgba(154,217,234,.1);border-radius:999px;padding:3px 10px}
.callout{background:rgba(244,184,96,.08);border-left:4px solid var(--amber);border-radius:4px 14px 14px 4px;padding:14px 16px;margin:22px 0}
.callout strong{color:var(--amber)}
.callout p:last-child{margin:0}
.callout.big p{font-family:var(--head);font-size:1.35rem;font-weight:600;line-height:1.3}
.defs{display:grid;gap:10px;margin:12px 0}
.def{background:var(--panel);border-radius:14px;padding:12px 14px}
.def b{color:var(--ice)}
.def ul{margin:6px 0 0;padding-left:20px}
.def li{margin-bottom:4px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare > div{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.compare h4{font-size:1.15rem;margin-bottom:2px}
.compare .when{color:var(--muted);font-size:14px;margin-bottom:10px;line-height:1.35}
.compare ul{margin:0;padding-left:18px;font-size:15px;line-height:1.45}
.compare li{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px}
.tablewrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;margin:12px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:700;color:var(--ice);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
.wide-table{min-width:640px}
.cat{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.key{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#1A1306;font-weight:700;font-size:12px}
.chain{display:grid;gap:10px;margin:12px 0}
.chain > div{background:var(--panel);border-radius:14px;padding:12px 14px}
.chain b{display:block;margin-bottom:4px}
.chain p{margin:0;font-size:15px;color:#C9D5E3}
.next-row{margin-top:34px}
.next-note{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
.source{font-size:13px;color:var(--muted);margin-top:6px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(4,10,18,.65);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.on{display:flex}
.sheet{background:var(--panel);border:1.5px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:520px;padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.sheet p{color:#C9D5E3}
.sheet .row{display:flex;gap:10px;margin-top:18px}
.sheet .row .btn{flex:1}
.count{font-family:var(--head);font-size:3rem;font-weight:800;color:var(--amber);line-height:1;margin:6px 0 4px}
.small{font-size:13px;color:var(--muted)}

.sheet.tall{max-height:calc(92vh - env(safe-area-inset-top,0px));max-height:calc(92dvh - env(safe-area-inset-top,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Cog, profile, games */
.cog{position:absolute;top:12px;right:12px;z-index:2;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:rgba(23,44,68,.8);display:grid;place-items:center;cursor:pointer;padding:0}
.cog svg{width:24px;height:24px}
.games-label{margin-top:22px}
.me-line{color:var(--muted);font-size:14px;margin:0 0 2px}
.field{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:700}
.inp{width:100%;background:var(--sky2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;color:var(--text)}
.inp.num{width:110px}
textarea.inp{min-height:150px;font-size:14px;line-height:1.4;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--sky2);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ice);color:#0D1B2A;border-color:var(--ice)}
.qgroup{margin:16px 0 0}
.qgroup-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.qgroup-head b{font-family:var(--head);font-size:1.05rem}
.qgroup-head .linkish{padding:4px;font-size:14px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1.5px solid var(--line);background:var(--sky2);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;text-align:left;line-height:1.3}
.tchip small{color:var(--muted);font-size:12.5px;margin-left:4px}
.tchip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1A1306}
.tchip[aria-pressed="true"] small{color:#5A4218}
.tchip:disabled{opacity:.4;cursor:default}
.msg{font-size:14px;margin:10px 0 0;color:var(--done)}
.msg.warn{color:var(--amber)}
.msg ul{margin:6px 0 0;padding-left:20px}
.counts{font-size:14px;color:#C9D5E3;margin:8px 0 0;padding-left:20px}
.counts li{margin-bottom:2px}
.steps{padding-left:20px;margin:6px 0 0;color:#C9D5E3}
.steps li{margin-bottom:4px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:22px 0 4px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){.earth{height:34vh}}
@media (max-width:360px){.compare{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="title" class="view" aria-labelledby="app-title">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <button class="cog" id="cogBtn" data-i18n-label="cogLabel" aria-label="Review questions"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#9AD9EA" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5a.5.5 0 0 0 .6.2l2.5-1a7.3 7.3 0 0 0 1.7 1l.4 2.6a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1a.5.5 0 0 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button>
  <div class="title-inner">
    <h1 id="app-title" data-i18n="appTitle">Earth Space Science <span>Notebook</span></h1>
    <p class="lede" data-i18n="lede">Notes, review games, and activities for each quarter. Your progress saves on this device.</p>
    <label for="quarter" class="small" style="display:block;margin-bottom:6px" data-i18n="openQuarter">Open a quarter</label>
    <div class="picker">
      <div class="select-wrap">
        <select id="quarter">
          <option value="" data-i18n="choose">Choose…</option>
          <option value="q1" data-i18n="q1">Quarter 1</option>
          <option value="q2" data-i18n="q2">Quarter 2</option>
          <option value="q3" data-i18n="q3">Quarter 3</option>
          <option value="q4" data-i18n="q4">Quarter 4</option>
        </select>
      </div>
      <button class="btn" id="openQ" disabled data-i18n="open">Open</button>
    </div>
    <label for="game" class="small games-label" style="display:block;margin-bottom:6px" data-i18n="playGame">Play a review game</label>
    <div class="picker">
      <div class="select-wrap">
        <select id="game">
          <option value="" data-i18n="choose">Choose…</option>
          <option value="hoops" data-i18n="hoops">Basketball</option>
          <option value="derby" data-i18n="derby">Home Run Derby</option>
          <option value="paint" data-i18n="paint">Restore the Masters (painting)</option>
          <option value="snake" data-i18n="snake">Snake</option>
          <option value="blasteroids" data-i18n="blasteroids">Blasteroids</option>
        </select>
      </div>
      <button class="btn" id="playG" disabled data-i18n="play">Play</button>
    </div>
  </div>
  <div class="title-foot"><p class="me-line" id="meLine"></p><button class="linkish" id="profileBtn" data-i18n="changeMe">Change name, period, or language</button> <button class="linkish" id="saveCheckBtn" data-i18n="saveCheck">Save check</button></div>
  <svg class="earth" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <radialGradient id="ocean" cx="50%" cy="15%" r="60%"><stop offset="0" stop-color="#2F7FB0"/><stop offset=".6" stop-color="#174B73"/><stop offset="1" stop-color="#0D2A45"/></radialGradient>
      <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <circle cx="200" cy="560" r="530" fill="none" stroke="#9AD9EA" stroke-width="7" opacity=".45" filter="url(#glow)"/>
    <circle cx="200" cy="560" r="530" fill="url(#ocean)"/>
    <path d="M60 70 C110 52 150 60 180 48 C215 36 250 52 300 44" stroke="#fff" stroke-opacity=".22" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M120 92 C170 80 230 88 280 74" stroke="#fff" stroke-opacity=".14" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M150 40 C175 33 200 38 214 44 C222 56 205 66 186 70 C168 66 156 56 150 40Z" fill="#3E7D5A" opacity=".55"/>
    <circle cx="200" cy="560" r="530" fill="none" stroke="#CFF1FA" stroke-width="1.5" opacity=".8"/>
  </svg>
</section>

<section id="toc" class="view">
  <div class="page">
    <div class="topbar">
      <button class="back" data-go="" data-i18n="quarters">Quarters</button>
      <span class="crumb" id="tocCrumb"></span>
    </div>
    <div class="toc-head">
      <h2 id="tocTitle"></h2>
      <p id="tocProgress"></p>
    </div>
    <div class="meter" aria-hidden="true"><i id="meterFill" style="width:0"></i></div>
    <p class="hint" data-i18n="dragHint">Press and hold a topic, then drag to move it.</p>
    <ul class="toc" id="tocList"></ul>
    <div class="reset-row"><button class="linkish" id="resetOrder" hidden data-i18n="resetOrder">Reset to Mr. T’s order</button></div>
  </div>
</section>

<section id="cardView" class="view">
  <div class="page">
    <div class="topbar">
      <button class="back" id="cardBack" data-i18n="contents">Contents</button>
      <span class="crumb" id="cardCrumb"></span>
    </div>
    <article class="card" id="cardBody"></article>
    <div class="next-row">
      <button class="btn wide" id="nextBtn" data-i18n="next">Next</button>
      <p class="next-note" data-i18n="actSoon">Activities for this topic are coming soon.</p>
    </div>
  </div>
</section>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================
   MR. T'S TOPIC ORDER  (edit this list to change the default)
   - One line per topic, top to bottom = order on the contents screen.
   - Students who rearrange keep their own order; new topics you add
     appear for them in the spot you put them here.
   - IDs are permanent save keys: never rename one after students use it.
   ========================================================= */
const TEACHER_ORDER = {
  q1: [
    "water-cycle",
    "weather-instruments",
    "station-models",
    "fronts",
    "air-masses",
    "hurricanes",
    "karst-florida",
    "earth-spheres",
    "sun-energy"
  ],
  q2: [
    "proxy-indicators",
    "ice-ages",
    "climate-vs-weather"
  ],
  q3: [],
  q4: []
};

/* =========================================================
   SAVE SYSTEM
   ========================================================= */
const APP_VERSION = "0.3";
const SAVE_KEY = "essNotebook.save";
const SAVE_VERSION = 3;
let storageOK = true;

function blankSave(){ return { v: SAVE_VERSION, items: {}, order: {}, lastQuarter: "", saveTest: 0, profile: null, addedQ: [], game: {} }; }
function migrate(d){
  if (!d || typeof d !== "object") return blankSave();
  if (!d.v || d.v < 2) { d.order = d.order || {}; }   // v1 -> v2: adds custom topic order
  d.items = d.items || {}; d.order = d.order || {};
  d.lastQuarter = d.lastQuarter || ""; d.saveTest = d.saveTest || 0;
  // v2 -> v3: adds the student's name/period/language, review questions added from the cog, and last game settings
  d.profile = d.profile || null; d.addedQ = Array.isArray(d.addedQ) ? d.addedQ : []; d.game = d.game || {};
  d.v = SAVE_VERSION;
  return d;
}
function loadSave(){ try { return migrate(JSON.parse(localStorage.getItem(SAVE_KEY))); } catch(e){ storageOK = false; return blankSave(); } }
function writeSave(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); storageOK = true; } catch(e){ storageOK = false; } }
let save = loadSave();
writeSave();

/* =========================================================
   LANGUAGE  (English / Español, chosen on first open)
   T("English", "Español") picks the text for the current language.
   ========================================================= */
const LANG = save.profile && save.profile.lang === "es" ? "es" : "en";
document.documentElement.lang = LANG;
function T(en, es){ return LANG === "es" ? es : en; }
const UI = {
  appTitle: ["Earth Space Science <span>Notebook</span>", "Ciencias de la Tierra y el Espacio <span>Cuaderno</span>"],
  lede: ["Notes, review games, and activities for each quarter. Your progress saves on this device.", "Notas, juegos de repaso y actividades para cada trimestre. Tu progreso se guarda en este aparato."],
  openQuarter: ["Open a quarter", "Abre un trimestre"],
  choose: ["Choose…", "Elige…"],
  q1: ["Quarter 1", "Trimestre 1"], q2: ["Quarter 2", "Trimestre 2"], q3: ["Quarter 3", "Trimestre 3"], q4: ["Quarter 4", "Trimestre 4"],
  open: ["Open", "Abrir"], play: ["Play", "Jugar"],
  playGame: ["Play a review game", "Juega un juego de repaso"],
  hoops: ["Basketball", "Baloncesto"], derby: ["Home Run Derby", "Derby de jonrones"],
  paint: ["Restore the Masters (painting)", "Restaura las obras maestras (pintura)"],

function applyUI(){
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = UI[el.dataset.i18n]; if (v) el.innerHTML = v[LANG === "es" ? 1 : 0]; });
  document.querySelectorAll("[data-i18n-label]").forEach(el => { const v = UI[el.dataset.i18nLabel]; if (v) el.setAttribute("aria-label", v[LANG === "es" ? 1 : 0]); });
}

function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function markDone(key){ save.items[key] = Object.assign(save.items[key] || {}, { viewed: true, at: Date.now() }); writeSave(); }
function isDone(key){ return !!(save.items[key] && save.items[key].viewed); }

/* Order: student's order if they made one, with any new teacher topics
   inserted right after the teacher's previous topic. */
function getOrder(q){
  const teacher = (TEACHER_ORDER[q] || []).filter(id => CARDS[id]);
  const mine = save.order[q];
  if (!Array.isArray(mine)) return teacher;
  const result = mine.filter(id => teacher.includes(id));
  teacher.forEach((id, i) => {
    if (result.includes(id)) return;
    let pos = 0;
    for (let j = i - 1; j >= 0; j--) { const k = result.indexOf(teacher[j]); if (k >= 0) { pos = k + 1; break; } }
    result.splice(pos, 0, id);
  });
  return result;
}

const F = 'font-family="Atkinson Hyperlegible, sans-serif"';
function txt(x, y, s, o = {}){
  return `<text x="${x}" y="${y}" ${F} font-size="${o.size||10.5}" fill="${o.fill||'#97A9BF'}"${o.anchor?` text-anchor="${o.anchor}"`:''}${o.weight?` font-weight="${o.weight}"`:''}>${s}</text>`;

function arrowDef(id, color){ return `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${color}"/></marker>`; }

const FRONT_COLORS = { cold: "#5AA9FF", warm: "#FF6B6B", occl: "#C58BFF" };
/* Weather-map front: pts = [[x,y],...]; markers point to the left of travel direction (s=1) or right (s=-1) */
function front(pts, type, s = 1, k = 1){
  const sp = 22 * k, segs = []; let L = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1], l = Math.hypot(x2-x1, y2-y1);
    segs.push({x1,y1,x2,y2,l,start:L}); L += l;
  }
  const P = pts.map(p => p.join(",")).join(" ");
  let out = "";
  if (type === "stat"){
    out += `<polyline points="${P}" fill="none" stroke="${FRONT_COLORS.warm}" stroke-width="${3*k}"/>`;
    out += `<polyline points="${P}" fill="none" stroke="${FRONT_COLORS.cold}" stroke-width="${3*k}" stroke-dasharray="${sp} ${sp}"/>`;
  } else {
    out += `<polyline points="${P}" fill="none" stroke="${FRONT_COLORS[type]}" stroke-width="${3*k}" stroke-linejoin="round"/>`;
  }
  const tri = `M${-5*k} 0 L${5*k} 0 L0 ${-7.5*k} Z`, semi = `M${-5.5*k} 0 A${5.5*k} ${5.5*k} 0 0 1 ${5.5*k} 0 Z`;
  for (let i = 0, d = sp/2; d < L - 3*k; i++, d += sp){
    const g = segs.find(sg => d >= sg.start && d <= sg.start + sg.l) || segs[segs.length-1];
    const t = (d - g.start) / g.l, x = g.x1 + (g.x2-g.x1)*t, y = g.y1 + (g.y2-g.y1)*t;
    const a = Math.atan2(g.y2-g.y1, g.x2-g.x1) * 180 / Math.PI;
    let shape, color, side = s;
    if (type === "cold"){ shape = tri; color = FRONT_COLORS.cold; }
    else if (type === "warm"){ shape = semi; color = FRONT_COLORS.warm; }
    else if (type === "occl"){ shape = i % 2 ? semi : tri; color = FRONT_COLORS.occl; }
    else { if (i % 2){ shape = semi; color = FRONT_COLORS.warm; side = -s; } else { shape = tri; color = FRONT_COLORS.cold; } }
    out += `<path d="${shape}" fill="${color}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(1 ${side})"/>`;
  }
  return out;
}

/* Hurricane spiral (counterclockwise spin, Northern Hemisphere) */
function spiral(cx, cy, R, w = 7){
  let out = "";
  for (let arm = 0; arm < 3; arm++){
    const phi = arm * 2 * Math.PI / 3; let d = "";
    for (let t = 0; t <= 1.0001; t += 0.04){
      const th = t * 1.5 * Math.PI, r = R*0.22 + t * R*0.78, ang = phi + th;
      d += (t === 0 ? "M" : "L") + (cx + r*Math.cos(ang)).toFixed(1) + " " + (cy + r*Math.sin(ang)).toFixed(1) + " ";
    }
    out += `<path d="${d}" fill="none" stroke="#C9D5E3" stroke-width="${w}" stroke-linecap="round" opacity=".55"/>`;
  }
  out += `<circle cx="${cx}" cy="${cy}" r="${R*0.17}" fill="none" stroke="#fff" stroke-width="${w*1.15}"/>`;
  out += `<circle cx="${cx}" cy="${cy}" r="${R*0.09}" fill="#0D1B2A"/>`;
  return out;
}

function waveRay(x, y, deg, n, color = "#F4B860"){
  let d = "M0 0 "; for (let i = 0; i < n; i++) d += i === 0 ? "q8 -6 16 0 " : "t16 0 ";
  return `<path d="${d}" transform="translate(${x} ${y}) rotate(${deg})" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/>`;
}

function badge(code, fill, ink = "#0D1B2A"){
  return `<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="32" fill="${fill}"/><text x="40" y="49" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="26" fill="${ink}">${code}</text></svg>`;
}

    <h3>Los cuatro tipos de frentes</h3>
    <div class="tiles">
      ${tile(`<svg viewBox="0 0 80 28" style="width:100%;height:auto" aria-hidden="true">${front([[4,18],[76,18]],"cold",1,1.5)}</svg>`,"Frente frío","El aire frío y denso se mete por debajo del aire cálido y lo empuja hacia arriba rápido. Trae una línea angosta de tormentas fuertes y luego aire más fresco y seco, un cambio de viento y presión que sube.","triángulos azules")}
      ${tile(`<svg viewBox="0 0 80 28" style="width:100%;height:auto" aria-hidden="true">${front([[4,18],[76,18]],"warm",1,1.5)}</svg>`,"Frente cálido","El aire cálido sube despacio por encima del aire frío que se retira. Trae nubes extensas y lluvia larga y constante, y luego aire más cálido y húmedo.","semicírculos rojos")}
      ${tile(`<svg viewBox="0 0 80 28" style="width:100%;height:auto" aria-hidden="true">${front([[4,14],[76,14]],"stat",1,1.5)}</svg>`,"Frente estacionario","Ninguna masa de aire tiene fuerza para empujar a la otra, así que el frente se detiene. Puede traer tiempo nublado y lluvioso por días.","alternados, en lados opuestos")}
      ${tile(`<svg viewBox="0 0 80 28" style="width:100%;height:auto" aria-hidden="true">${front([[4,18],[76,18]],"occl",1,1.5)}</svg>`,"Frente ocluido","Un frente frío rápido alcanza a un frente cálido y levanta todo el aire cálido del suelo. Suele formarse cuando un sistema de tormentas madura.","morado, con las dos formas")}
    </div>
    <p style="margin-top:12px">Los símbolos apuntan hacia donde se mueve el frente.</p>
    <h3>Cómo las altas y bajas presiones mueven los frentes</h3>
    <div class="compare">
      <div>
        <h4 style="color:#FF6B6B">Baja presión (L)</h4>
        <p class="when">El aire entra y sube</p>
        <ul><li>Gira en sentido contrario a las agujas del reloj en el hemisferio norte</li><li>El aire que sube se enfría y forma nubes y tormentas</li><li>Los frentes salen de la baja y viajan con ella</li></ul>
      </div>
      <div>
        <h4 style="color:#5AA9FF">Alta presión (H)</h4>
        <p class="when">El aire baja y sale</p>
        <ul><li>Gira en el sentido de las agujas del reloj en el hemisferio norte</li><li>El aire que baja se calienta y se seca, así que el cielo se despeja</li><li>Una alta fuerte empuja un frente frío hacia adelante, o bloquea un frente para que se detenga</li></ul>
      </div>
    </div>
    <p class="source">En los mapas de EE. UU. se usan las letras en inglés: L (low) para baja presión y H (high) para alta presión.</p>
    <h3>Un frente frío pasa por Florida</h3>
    <div class="tablewrap"><table>
      <tr><th></th><th>Antes</th><th>Durante</th><th>Después</th></tr>
      <tr><td><b>Temperatura</b></td><td>Cálida</td><td>Bajando</td><td>Más fresca</td></tr>
      <tr><td><b>Humedad</b></td><td>Húmedo</td><td>—</td><td>Más seco</td></tr>
      <tr><td><b>Viento</b></td><td>S o SO</td><td>Ráfagas, cambia</td><td>NO o N</td></tr>
      <tr><td><b>Presión</b></td><td>Bajando</td><td>La más baja</td><td>Subiendo</td></tr>
      <tr><td><b>Cielo</b></td><td>Se forman nubes</td><td>Línea de tormentas</td><td>Se despeja</td></tr>
    </table></div>
    <div class="callout"><p><strong>Consejo para pronosticar.</strong> En EE. UU., los vientos del oeste que predominan llevan la mayoría de las bajas, las altas y los frentes de oeste a este. Mira el tiempo al oeste de ti para ver lo que viene.</p></div>`
  }
},

"air-masses": {
  title: "Air masses",
  blurb: "Huge bodies of air named for where they form",
  icon: ART.airIcon,
  body: () => `${HERO.air()}
    <h2>Air masses</h2>
    <p class="intro">An <b>air mass</b> is a huge body of air, often over 1,000 miles across, with about the same temperature and humidity throughout. It gets those properties from the region where it forms, called its <b>source region</b>.</p>
    <h3>Cracking the code</h3>
    <div class="tablewrap"><table>
      <tr><th>Letter</th><th>Means</th><th>Tells you</th></tr>
      <tr><td><b>c</b></td><td>continental</td><td>formed over land, so it’s dry</td></tr>
      <tr><td><b>m</b></td><td>maritime</td><td>formed over ocean, so it’s humid</td></tr>
      <tr><td><b>T</b></td><td>tropical</td><td>formed near the tropics, so it’s warm</td></tr>
      <tr><td><b>P</b></td><td>polar</td><td>formed at high latitudes, so it’s cold</td></tr>
      <tr><td><b>A</b></td><td>arctic</td><td>formed over the Arctic, so it’s bitterly cold</td></tr>
    </table></div>
    <h3>The five main types</h3>
    <div class="tiles">
      ${tile(badge("mT","#F28C4E"),"Maritime tropical","Warm and humid. Forms over the Gulf, Caribbean, and tropical Atlantic. Florida’s everyday summer air, fueling afternoon thunderstorms.")}
      ${tile(badge("cP","#5AA9FF"),"Continental polar","Cold and dry. Forms over northern Canada. Arrives behind winter cold fronts, giving Florida its crisp, cool days.")}
      ${tile(badge("cA","#C9E6FF"),"Continental arctic","Bitterly cold and very dry. Forms over the Arctic. Rarely reaches Florida, but can bring damaging freezes to crops when it does.")}
      ${tile(badge("mP","#7FC4D8"),"Maritime polar","Cool and moist. Forms over the North Pacific and North Atlantic. Brings rain and snow to the Pacific Northwest and New England.")}
      ${tile(badge("cT","#E8B26A"),"Continental tropical","Hot and dry. Forms over the deserts of Mexico and the southwestern U.S. Brings summer heat waves to the Southwest.")}
    </div>
    <div class="callout"><p><strong>Air masses change as they travel.</strong> Cold, dry cP air crossing the warm Great Lakes picks up moisture and dumps “lake-effect” snow downwind. Where two air masses collide, a front forms.</p></div>`,
  es: {
    title: "Masas de aire",
    blurb: "Enormes cuerpos de aire que se nombran según donde se forman",
    body: () => `${HERO.air()}
    <h2>Masas de aire</h2>
    <p class="intro">Una <b>masa de aire</b> es un enorme cuerpo de aire, a menudo de más de 1,000 millas de ancho, con más o menos la misma temperatura y humedad en todas partes. Toma esas propiedades de la región donde se forma, llamada su <b>región de origen</b>.</p>
    <h3>Descifrando el código</h3>
    <div class="tablewrap"><table>
      <tr><th>Letra</th><th>Significa</th><th>Te dice</th></tr>
      <tr><td><b>c</b></td><td>continental</td><td>se formó sobre tierra, así que es seca</td></tr>
      <tr><td><b>m</b></td><td>marítima</td><td>se formó sobre el océano, así que es húmeda</td></tr>
      <tr><td><b>T</b></td><td>tropical</td><td>se formó cerca de los trópicos, así que es cálida</td></tr>
      <tr><td><b>P</b></td><td>polar</td><td>se formó en latitudes altas, así que es fría</td></tr>
      <tr><td><b>A</b></td><td>ártica</td><td>se formó sobre el Ártico, así que es muy fría</td></tr>
    </table></div>
    <h3>Los cinco tipos principales</h3>
    <div class="tiles">
      ${tile(badge("mT","#F28C4E"),"Tropical marítima","Cálida y húmeda. Se forma sobre el Golfo, el Caribe y el Atlántico tropical. Es el aire de todos los días del verano en Florida y alimenta las tormentas de la tarde.")}
      ${tile(badge("cP","#5AA9FF"),"Polar continental","Fría y seca. Se forma sobre el norte de Canadá. Llega detrás de los frentes fríos del invierno y le da a Florida sus días frescos y secos.")}
      ${tile(badge("cA","#C9E6FF"),"Ártica continental","Muy fría y muy seca. Se forma sobre el Ártico. Casi nunca llega a Florida, pero cuando llega puede causar heladas que dañan los cultivos.")}
      ${tile(badge("mP","#7FC4D8"),"Polar marítima","Fresca y húmeda. Se forma sobre el Pacífico Norte y el Atlántico Norte. Trae lluvia y nieve al noroeste del Pacífico y a Nueva Inglaterra.")}
      ${tile(badge("cT","#E8B26A"),"Tropical continental","Caliente y seca. Se forma sobre los desiertos de México y el suroeste de EE. UU. Trae olas de calor en el verano al suroeste.")}
    </div>
    <div class="callout"><p><strong>Las masas de aire cambian al viajar.</strong> El aire cP frío y seco que cruza los Grandes Lagos, más cálidos, recoge humedad y deja caer nieve por “efecto lago” del otro lado. Donde chocan dos masas de aire, se forma un frente.</p></div>`
  }
},

"hurricanes": {
  title: "Hurricanes",
  blurb: "How they form, how they’re rated, how to prepare, and Hurricane Ian’s path",
  icon: ART.hurricaneIcon,
  body: () => `${HERO.hurricane()}
    <h2>Hurricanes</h2>
    <p class="intro">A <b>hurricane</b> is a powerful <b>tropical cyclone</b>: a spinning low-pressure system of organized thunderstorms that forms over warm tropical oceans, with sustained winds of at least 74 mph.</p>
    <h3>From disturbance to hurricane</h3>
    <div class="defs">
      ${def("Tropical disturbance","a cluster of thunderstorms over warm water, often a tropical wave moving west off Africa.")}
      ${def("Tropical depression","a closed circulation forms; winds up to 38 mph.")}
      ${def("Tropical storm","winds 39–73 mph. The storm gets a name.")}
      ${def("Hurricane","winds 74 mph or higher.")}
    </div>
    <h3>Ingredients a hurricane needs</h3>
    <div class="chips">
      <span>Ocean water at least 80°F (26.5°C), warm to about 150 ft deep</span>
      <span>Moist air</span>
      <span>Low wind shear (winds not changing much with height)</span>
      <span>A starting disturbance</span>
      <span>At least about 5° from the equator, so Earth’s spin can start the rotation</span>
    </div>
    <p style="margin-top:12px">Energy comes from warm ocean water: as water evaporates and later condenses in the storm’s clouds, it releases heat that powers the hurricane. That’s why hurricanes weaken over land or cool water.</p>
    <h3>Where they form and what they’re called</h3>
    <div class="tiles">
      ${tile("","Hurricane","Atlantic Ocean, Caribbean, Gulf, and the eastern and central North Pacific.")}
      ${tile("","Typhoon","Northwestern Pacific, near Japan, the Philippines, and China.")}
      ${tile("","Cyclone","Indian Ocean and the South Pacific near Australia.")}
    </div>
    <p style="margin-top:12px">The Atlantic hurricane season runs June 1 to November 30, peaking from mid-August through October.</p>
    <h3>Parts of a hurricane</h3>
    <div class="defs">
      ${def("Eye","the calm center, often clear with light winds and the lowest air pressure. Usually 20–40 miles across.")}
      ${def("Eyewall","a ring of towering thunderstorms around the eye, with the strongest winds and heaviest rain.")}
      ${def("Rain bands","spiral bands of storms reaching out hundreds of miles. They bring bursts of heavy rain, gusty winds, and sometimes tornadoes.")}
      ${def("Outflow","air that rose in the storm spreads out at the top, forming a wide shield of high, thin clouds.")}
      ${def("Right-front side","for a storm moving forward, the side to the right of its path usually has the strongest winds and highest storm surge.")}
    </div>
    <h3>The Saffir-Simpson Hurricane Wind Scale</h3>
    <div class="tablewrap"><table>
      <tr><th>Category</th><th>Winds</th><th>Damage</th></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c1}"></span><b>1</b></td><td class="nw">74–95 mph</td><td>Very dangerous winds damage roofs, siding, and gutters; power outages likely</td></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c2}"></span><b>2</b></td><td class="nw">96–110 mph</td><td>Extremely dangerous; major roof damage, many trees uprooted, outages for days to weeks</td></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c3}"></span><b>3</b> major</td><td class="nw">111–129 mph</td><td>Devastating; homes can lose roofs, water and power out for days to weeks</td></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c4}"></span><b>4</b> major</td><td class="nw">130–156 mph</td><td>Catastrophic; severe damage to homes, most trees snapped, area may be unlivable for weeks or months</td></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c5}"></span><b>5</b> major</td><td class="nw">157+ mph</td><td>Catastrophic; many homes destroyed, area may be unlivable for weeks or months</td></tr>
    </table></div>
    <p class="source">The scale rates wind only. It doesn’t include storm surge or rain flooding, which often cause the most deaths.</p>
    <h3>Other dangers</h3>
    <div class="tiles">
      ${tile("","Storm surge","An abnormal rise of seawater pushed ashore by the storm’s winds. The deadliest hurricane hazard.")}
      ${tile("","Storm tide","Storm surge plus the normal tide. A surge arriving at high tide floods higher and farther inland.")}
      ${tile("","Freshwater flooding","Slow-moving storms can drop well over a foot of rain, flooding rivers far inland.")}
      ${tile("","Waves & rip currents","Large waves batter the coast and dangerous rip currents can form hundreds of miles away.")}
      ${tile("","Tornadoes","Short-lived tornadoes often spin up in the outer rain bands.")}
      ${tile("","Wind","Flying debris and falling trees damage buildings and knock out power.")}
    </div>
    <h3>How to prepare</h3>
    <div class="compare">
      <div><h4 style="color:var(--amber)">Hurricane watch</h4><p class="when" style="margin:0">Hurricane conditions are <b>possible</b>, issued about 48 hours ahead. Finish preparing.</p></div>
      <div><h4 style="color:#FF6B6B">Hurricane warning</h4><p class="when" style="margin:0">Hurricane conditions are <b>expected</b>, issued about 36 hours ahead. Complete your plan or evacuate if told to.</p></div>
    </div>
    <div class="defs" style="margin-top:12px">
      <div class="def"><b>Before the season:</b><ul><li>Know your evacuation zone and where you would go.</li><li>Make a family plan, including pets.</li><li>Build a supply kit.</li></ul></div>
      <div class="def"><b>When a storm threatens:</b><ul><li>Bring in outdoor objects and protect windows.</li><li>Fill prescriptions, charge devices, and fill the gas tank.</li><li>Follow evacuation orders. Run from the water, hide from the wind.</li></ul></div>
      <div class="def"><b>After the storm:</b><ul><li>Stay out of floodwater; it can hide power lines and debris.</li><li>Run generators outside only, far from windows, to avoid carbon monoxide.</li><li>Wait for officials to say it’s safe to return.</li></ul></div>
    </div>
    <p style="margin-top:10px"><b>Supply kit:</b></p>
    <div class="chips"><span>Water: 1 gallon per person per day</span><span>Food that doesn’t need cooking</span><span>Medicines</span><span>Flashlights & batteries</span><span>Battery radio</span><span>First-aid kit</span><span>Phone chargers & power bank</span><span>Documents in a waterproof bag</span><span>Cash</span><span>Pet supplies</span></div>
    <h3>Case study: Hurricane Ian (2022)</h3>
    <p>Ian grew from a tropical wave off Africa into the costliest hurricane in Florida’s history. Follow it from birth to landfall.</p>
    ${HERO.ianMap()}
    <div class="tablewrap"><table class="wide-table">
      <tr><th></th><th>Date & time (EDT)</th><th>Location</th><th>Wind</th><th>Pressure</th><th>Strength</th><th>What happened</th></tr>
      ${IAN_EVENTS.map(e => `<tr><td><span class="key">${e.k}</span></td><td class="nw">${e.t}</td><td class="nw">${e.lat.toFixed(1)}°N, ${Math.abs(e.lon).toFixed(1)}°W</td><td class="nw">${e.mph} mph</td><td class="nw">${e.mb} mb</td><td class="nw"><span class="cat" style="background:${CAT_COLORS[stageClass(e.stage)]}"></span>${e.stage}</td><td style="min-width:200px">${e.note}</td></tr>`).join("")}
    </table></div>
    <p class="source">Scroll the table sideways to see every column. Winds rounded to the nearest 5 mph. Data: National Hurricane Center Tropical Cyclone Report, Hurricane Ian.</p>
    <div class="tiles">
      ${tile("","Notice the pattern","As pressure dropped from 1006 mb to 937 mb, winds climbed from 35 to 160 mph. Lower pressure means a stronger storm.")}
      ${tile("","Storm surge","Water rose 10 to 15 feet above the ground on Fort Myers Beach. Surge caused most of the storm’s direct deaths.")}
      ${tile("","Rain","Up to about 27 inches fell near the landfall area, flooding rivers across central Florida.")}
      ${tile("","Cost","About $113 billion in U.S. damage, the costliest hurricane in Florida history.")}
    </div>`,
  es: {
    title: "Huracanes",
    blurb: "Cómo se forman, cómo se clasifican, cómo prepararse y la trayectoria del huracán Ian",
    body: () => `${HERO.hurricane()}
    <h2>Huracanes</h2>
    <p class="intro">Un <b>huracán</b> es un poderoso <b>ciclón tropical</b>: un sistema giratorio de baja presión hecho de tormentas organizadas que se forma sobre océanos tropicales cálidos, con vientos sostenidos de al menos 74 mph.</p>
    <h3>De perturbación a huracán</h3>
    <div class="defs">
      ${def("Perturbación tropical","un grupo de tormentas sobre agua cálida, a menudo una onda tropical que se mueve al oeste desde África.")}
      ${def("Depresión tropical","se forma una circulación cerrada; vientos de hasta 38 mph.")}
      ${def("Tormenta tropical","vientos de 39 a 73 mph. La tormenta recibe un nombre.")}
      ${def("Huracán","vientos de 74 mph o más.")}
    </div>
    <h3>Ingredientes que necesita un huracán</h3>
    <div class="chips">
      <span>Agua del océano de al menos 80 °F (26.5 °C), cálida hasta unos 150 pies de profundidad</span>
      <span>Aire húmedo</span>
      <span>Poca cizalladura del viento (vientos que cambian poco con la altura)</span>
      <span>Una perturbación inicial</span>
      <span>Al menos unos 5° del ecuador, para que el giro de la Tierra pueda empezar la rotación</span>
    </div>
    <p style="margin-top:12px">La energía viene del agua cálida del océano: cuando el agua se evapora y luego se condensa en las nubes de la tormenta, suelta calor que alimenta al huracán. Por eso los huracanes se debilitan sobre tierra o sobre agua fría.</p>
    <h3>Dónde se forman y cómo se llaman</h3>
    <div class="tiles">
      ${tile("","Huracán","Océano Atlántico, el Caribe, el Golfo y el Pacífico Norte oriental y central.")}
      ${tile("","Tifón","Pacífico noroeste, cerca de Japón, Filipinas y China.")}
      ${tile("","Ciclón","Océano Índico y el Pacífico Sur cerca de Australia.")}
    </div>
    <p style="margin-top:12px">La temporada de huracanes del Atlántico va del 1 de junio al 30 de noviembre, con su punto más fuerte de mediados de agosto a octubre.</p>
    <h3>Partes de un huracán</h3>
    <div class="defs">
      ${def("Ojo","el centro tranquilo, a menudo despejado, con vientos suaves y la presión más baja. Suele medir de 20 a 40 millas.")}
      ${def("Pared del ojo","un anillo de tormentas altísimas alrededor del ojo, con los vientos más fuertes y la lluvia más intensa.")}
      ${def("Bandas de lluvia","bandas de tormentas en espiral que se extienden cientos de millas. Traen ráfagas de lluvia fuerte, viento y a veces tornados.")}
      ${def("Flujo de salida","el aire que subió en la tormenta se esparce arriba y forma un escudo ancho de nubes altas y delgadas.")}
      ${def("Lado delantero derecho","en una tormenta que avanza, el lado a la derecha de su trayectoria suele tener los vientos más fuertes y la marejada más alta.")}
    </div>
    <h3>La escala de vientos de huracanes Saffir-Simpson</h3>
    <div class="tablewrap"><table>
      <tr><th>Categoría</th><th>Vientos</th><th>Daños</th></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c1}"></span><b>1</b></td><td class="nw">74–95 mph</td><td>Vientos muy peligrosos dañan techos, paredes exteriores y canaletas; es probable que se vaya la luz</td></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c2}"></span><b>2</b></td><td class="nw">96–110 mph</td><td>Extremadamente peligroso; daños grandes en techos, muchos árboles arrancados, sin luz por días o semanas</td></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c3}"></span><b>3</b> mayor</td><td class="nw">111–129 mph</td><td>Devastador; las casas pueden perder el techo, sin agua ni luz por días o semanas</td></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c4}"></span><b>4</b> mayor</td><td class="nw">130–156 mph</td><td>Catastrófico; daños graves en casas, la mayoría de los árboles quebrados, la zona puede quedar inhabitable por semanas o meses</td></tr>
      <tr><td class="nw"><span class="cat" style="background:${CAT_COLORS.c5}"></span><b>5</b> mayor</td><td class="nw">157+ mph</td><td>Catastrófico; muchas casas destruidas, la zona puede quedar inhabitable por semanas o meses</td></tr>
    </table></div>
    <p class="source">La escala solo mide el viento. No incluye la marejada ciclónica ni las inundaciones por lluvia, que a menudo causan la mayoría de las muertes.</p>
    <h3>Otros peligros</h3>
    <div class="tiles">
      ${tile("","Marejada ciclónica","Una subida anormal del agua del mar empujada a la costa por los vientos de la tormenta. Es el peligro más mortal de un huracán.")}
      ${tile("","Marea de tormenta","La marejada ciclónica más la marea normal. Una marejada que llega con la marea alta inunda más alto y más tierra adentro.")}
      ${tile("","Inundación de agua dulce","Las tormentas lentas pueden dejar caer mucho más de un pie de lluvia e inundar ríos lejos de la costa.")}
      ${tile("","Olas y corrientes de resaca","Olas grandes golpean la costa y se pueden formar corrientes de resaca peligrosas a cientos de millas.")}
      ${tile("","Tornados","A menudo se forman tornados cortos en las bandas de lluvia exteriores.")}
      ${tile("","Viento","Los escombros que vuelan y los árboles que caen dañan edificios y cortan la luz.")}
    </div>
    <h3>Cómo prepararse</h3>
    <div class="compare">
      <div><h4 style="color:var(--amber)">Vigilancia de huracán</h4><p class="when" style="margin:0">Las condiciones de huracán son <b>posibles</b>; se emite unas 48 horas antes. Termina de prepararte.</p></div>
      <div><h4 style="color:#FF6B6B">Aviso de huracán</h4><p class="when" style="margin:0">Se <b>esperan</b> condiciones de huracán; se emite unas 36 horas antes. Completa tu plan o evacúa si te lo ordenan.</p></div>
    </div>
    <div class="defs" style="margin-top:12px">
      <div class="def"><b>Antes de la temporada:</b><ul><li>Conoce tu zona de evacuación y a dónde irías.</li><li>Haz un plan familiar, incluyendo a las mascotas.</li><li>Arma un kit de suministros.</li></ul></div>
      <div class="def"><b>Cuando se acerca una tormenta:</b><ul><li>Guarda los objetos de afuera y protege las ventanas.</li><li>Surte las recetas, carga los aparatos y llena el tanque de gasolina.</li><li>Sigue las órdenes de evacuación. Huye del agua, escóndete del viento.</li></ul></div>
      <div class="def"><b>Después de la tormenta:</b><ul><li>No te metas en el agua de inundación; puede esconder cables eléctricos y escombros.</li><li>Usa los generadores solo afuera, lejos de las ventanas, para evitar el monóxido de carbono.</li><li>Espera a que las autoridades digan que es seguro regresar.</li></ul></div>
    </div>
    <p style="margin-top:10px"><b>Kit de suministros:</b></p>

"karst-florida": {
  title: "Florida’s karst, aquifer & sinkholes",
  blurb: "How dissolving limestone makes caves, springs, and sinkholes",
  icon: ART.sinkIcon,
  body: () => `${HERO.karst()}
    <h2>Florida’s karst, aquifer & sinkholes</h2>
    <p class="intro">Much of Florida sits on thick layers of <b>limestone</b>, rock built from the shells and skeletons of sea creatures when Florida was under a shallow sea. Water slowly dissolves this rock, creating a landscape called <b>karst topography</b>.</p>
    <h3>How limestone dissolves</h3>
    <p>Rainwater absorbs carbon dioxide from the air and soil, forming weak <b>carbonic acid</b>. As this slightly acidic water seeps through cracks in limestone, it dissolves the rock (chemical weathering), widening cracks into channels, tunnels, and caves over thousands of years.</p>
    <h3>Karst features</h3>
    <div class="tiles">
      ${tile("","Caves & conduits","Underground passages, most of them filled with water in Florida. Florida Caverns State Park has dry caves you can walk through.")}
      ${tile("","Springs","Places where groundwater flows out to the surface. Florida has more than 1,000 springs, one of the largest concentrations on Earth.")}
      ${tile("","Sinkholes","Depressions or holes that form when the ground sinks into dissolved spaces in the limestone below.")}
      ${tile("","Sinkhole lakes","Many of Florida’s round lakes are old sinkholes that filled with water.")}
      ${tile("","Disappearing rivers","Some rivers flow into a sinkhole and travel underground before resurfacing, like the Santa Fe River.")}
    </div>
    <h3>The Floridan aquifer</h3>
    <p>The limestone is so full of openings that it holds enormous amounts of water. The <b>Floridan aquifer</b> lies under all of Florida and parts of Georgia, Alabama, and South Carolina, and it’s the main drinking water source for most of the state. Rain recharges it fastest where sandy soils let water soak straight in, like the ridges of central Florida.</p>
    <h3>Three kinds of sinkholes</h3>
    <div class="defs">
      ${def("Dissolution","limestone near the surface dissolves gradually, forming a slow, shallow dip that often fills with water.")}
      ${def("Cover-subsidence","sand slowly trickles down into openings in the limestone, so the ground sags gradually.")}
      ${def("Cover-collapse","a cavity grows under a layer of clay until the roof suddenly gives way. These can appear in hours and are the most dangerous.")}
    </div>
    <h3>How groundwater use affects karst</h3>
    <p>Groundwater filling underground spaces helps support the rock and sediment above. Heavy pumping lowers the water table, especially right around a well (the <b>cone of depression</b>), which can take away that support.</p>
    <div class="defs">
      ${def("More sinkholes","sinkholes often appear after big drops in the water table, or when heavy rain follows a drought.")}
      ${def("Weaker springs","less groundwater means lower spring flow, harming rivers and wildlife like manatees that depend on warm spring water.")}
      ${def("Saltwater intrusion","near the coast, over-pumping can let seawater move into the aquifer and spoil wells.")}
      ${def("Drying wetlands","lakes and wetlands connected to the water table can shrink.")}
    </div>
    <div class="callout"><p><strong>Real example: Plant City, 2010.</strong> During a January freeze, strawberry farmers pumped huge amounts of groundwater to spray protective ice on their crops. The water table dropped about 60 feet, and roughly 140 sinkholes opened in the area.</p></div>`,
  es: {
    title: "El karst, el acuífero y los sumideros de Florida",
    blurb: "Cómo la caliza que se disuelve forma cuevas, manantiales y sumideros",
    body: () => `${HERO.karst()}
    <h2>El karst, el acuífero y los sumideros de Florida</h2>
    <p class="intro">Gran parte de Florida está sobre gruesas capas de <b>caliza</b>, una roca formada por las conchas y esqueletos de animales marinos cuando Florida estaba bajo un mar poco profundo. El agua disuelve esta roca poco a poco y crea un paisaje llamado <b>topografía kárstica</b>.</p>
    <h3>Cómo se disuelve la caliza</h3>
    <p>El agua de lluvia absorbe dióxido de carbono del aire y del suelo y forma un ácido débil, el <b>ácido carbónico</b>. Cuando esta agua un poco ácida se filtra por las grietas de la caliza, disuelve la roca (meteorización química) y, con miles de años, convierte las grietas en canales, túneles y cuevas.</p>
    <h3>Formas del karst</h3>
    <div class="tiles">
      ${tile("","Cuevas y conductos","Pasajes bajo tierra; en Florida, la mayoría están llenos de agua. El Parque Estatal Florida Caverns tiene cuevas secas que puedes recorrer.")}
      ${tile("","Manantiales","Lugares donde el agua subterránea sale a la superficie. Florida tiene más de 1,000 manantiales, uno de los grupos más grandes del mundo.")}
      ${tile("","Sumideros","Hundimientos u hoyos que se forman cuando el suelo se hunde en los espacios disueltos de la caliza de abajo.")}
      ${tile("","Lagos de sumidero","Muchos de los lagos redondos de Florida son sumideros viejos que se llenaron de agua.")}
      ${tile("","Ríos que desaparecen","Algunos ríos entran a un sumidero y viajan bajo tierra antes de volver a salir, como el río Santa Fe.")}
    </div>
    <h3>El acuífero de Florida</h3>
    <p>La caliza tiene tantos huecos que guarda enormes cantidades de agua. El <b>acuífero de Florida</b> está debajo de todo el estado y de partes de Georgia, Alabama y Carolina del Sur, y es la fuente principal de agua potable de casi todo el estado. La lluvia lo recarga más rápido donde los suelos arenosos dejan que el agua se filtre directo, como en las lomas del centro de Florida.</p>
    <h3>Tres tipos de sumideros</h3>
    <div class="defs">
      ${def("Por disolución","la caliza cerca de la superficie se disuelve poco a poco y forma un hundimiento lento y poco profundo que a menudo se llena de agua.")}
      ${def("Por hundimiento de la cubierta","la arena cae poco a poco en los huecos de la caliza, así que el suelo se hunde despacio.")}
      ${def("Por colapso de la cubierta","una cavidad crece debajo de una capa de arcilla hasta que el techo se cae de repente. Pueden aparecer en horas y son los más peligrosos.")}
    </div>
    <h3>Cómo el uso del agua subterránea afecta el karst</h3>
    <p>El agua subterránea que llena los espacios bajo tierra ayuda a sostener la roca y el sedimento de arriba. Bombear mucha agua baja el nivel freático, sobre todo alrededor de un pozo (el <b>cono de depresión</b>), y puede quitar ese soporte.</p>
    <div class="defs">
      ${def("Más sumideros","los sumideros suelen aparecer después de grandes bajadas del nivel freático, o cuando llueve fuerte después de una sequía.")}
      ${def("Manantiales más débiles","menos agua subterránea significa menos flujo en los manantiales, lo que daña los ríos y a animales como los manatíes, que dependen del agua tibia de los manantiales.")}
      ${def("Intrusión de agua salada","cerca de la costa, bombear demasiado puede dejar que el agua de mar entre al acuífero y dañe los pozos.")}
      ${def("Humedales que se secan","los lagos y humedales conectados al nivel freático pueden encogerse.")}
    </div>
    <div class="callout"><p><strong>Ejemplo real: Plant City, 2010.</strong> Durante una helada en enero, los productores de fresas bombearon muchísima agua subterránea para rociar hielo protector sobre sus cultivos. El nivel freático bajó unos 60 pies y se abrieron cerca de 140 sumideros en la zona.</p></div>`
  }
},

"earth-spheres": {
  title: "Earth’s spheres",
  blurb: "Geosphere, hydrosphere, cryosphere, atmosphere, biosphere, and how they interact",
  icon: ART.spheresIcon,
  body: () => `${HERO.spheres()}
    <h2>Earth’s spheres</h2>
    <p class="intro">Scientists divide the Earth system into parts called <b>spheres</b>. Each one is different, but they constantly trade matter and energy, so a change in one sphere affects the others.</p>
    <div class="tiles">
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="30" fill="#A07A4E"/><circle cx="40" cy="40" r="18" fill="#C86B3C"/><circle cx="40" cy="40" r="8" fill="#F4B860"/></svg>`,"Geosphere","The solid Earth: rocks, minerals, soil, landforms, and the interior layers (crust, mantle, core). Florida’s limestone bedrock is part of it.")}
      ${tile(ART.drop,"Hydrosphere","All of Earth’s water: oceans, lakes, rivers, groundwater, and water vapor. About 97% of it is salty ocean water.")}
      ${tile(ART.snow,"Cryosphere","Frozen water: glaciers, ice sheets, sea ice, snow, and permanently frozen ground. Often counted as part of the hydrosphere. Its bright surface reflects sunlight.")}
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="50" r="22" fill="#2F7FB0"/><circle cx="40" cy="50" r="30" fill="none" stroke="#5AA9FF" stroke-width="5" opacity=".6"/><circle cx="40" cy="50" r="37" fill="none" stroke="#5AA9FF" stroke-width="3" opacity=".3"/></svg>`,"Atmosphere","The layer of gases around Earth: about 78% nitrogen, 21% oxygen, plus small amounts of argon, carbon dioxide, and water vapor. Weather happens in its lowest layer, the troposphere.")}
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M40 70 V36" stroke="#6E4A2C" stroke-width="5"/><circle cx="40" cy="28" r="18" fill="#3E9A62"/><circle cx="26" cy="38" r="10" fill="#4FB074"/><circle cx="54" cy="38" r="10" fill="#4FB074"/></svg>`,"Biosphere","All living things, from bacteria to people, plus the places they live. Life exists in the other spheres: soil, water, and air.")}
    </div>
    <h3>Spheres in action</h3>
    <div class="chain">
      <div><b>A hurricane</b><p>Warm ocean water evaporates into the air (hydrosphere → atmosphere), fueling the storm. Winds and surge erode beaches (atmosphere → geosphere) and damage mangroves and reefs (→ biosphere).</p></div>
      <div><b>Plants breathing</b><p>Plants take in carbon dioxide and release oxygen and water vapor (biosphere ↔ atmosphere), and their roots pull water from the soil (geosphere, hydrosphere).</p></div>
      <div><b>Florida’s caves</b><p>Carbon dioxide from the air dissolves in rainwater (atmosphere → hydrosphere), and that acidic water dissolves limestone (→ geosphere).</p></div>
      <div><b>A volcanic eruption</b><p>Ash and gases blast into the air (geosphere → atmosphere), can block sunlight and cool the climate, and affect crops and animals (→ biosphere).</p></div>
      <div><b>Melting ice sheets</b><p>Melting ice adds water to the ocean (cryosphere → hydrosphere), raising sea level and reshaping coastlines (→ geosphere).</p></div>
      <div><b>Sea turtle nests</b><p>The temperature of beach sand (geosphere) decides whether baby sea turtles (biosphere) hatch as males or females: warmer sand produces more females.</p></div>
    </div>`,
  es: {
    title: "Las esferas de la Tierra",
    blurb: "Geosfera, hidrosfera, criosfera, atmósfera, biosfera y cómo interactúan",
    body: () => `${HERO.spheres()}
    <h2>Las esferas de la Tierra</h2>
    <p class="intro">Los científicos dividen el sistema de la Tierra en partes llamadas <b>esferas</b>. Cada una es diferente, pero intercambian materia y energía todo el tiempo, así que un cambio en una esfera afecta a las demás.</p>
    <div class="tiles">
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="30" fill="#A07A4E"/><circle cx="40" cy="40" r="18" fill="#C86B3C"/><circle cx="40" cy="40" r="8" fill="#F4B860"/></svg>`,"Geosfera","La Tierra sólida: rocas, minerales, suelo, formas del terreno y las capas del interior (corteza, manto, núcleo). La caliza de Florida es parte de ella.")}
      ${tile(ART.drop,"Hidrosfera","Toda el agua de la Tierra: océanos, lagos, ríos, agua subterránea y vapor de agua. Cerca del 97% es agua salada del océano.")}
      ${tile(ART.snow,"Criosfera","El agua congelada: glaciares, capas de hielo, hielo marino, nieve y suelo congelado todo el año. A menudo se cuenta como parte de la hidrosfera. Su superficie brillante refleja la luz del sol.")}
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="50" r="22" fill="#2F7FB0"/><circle cx="40" cy="50" r="30" fill="none" stroke="#5AA9FF" stroke-width="5" opacity=".6"/><circle cx="40" cy="50" r="37" fill="none" stroke="#5AA9FF" stroke-width="3" opacity=".3"/></svg>`,"Atmósfera","La capa de gases que rodea la Tierra: cerca de 78% nitrógeno, 21% oxígeno y pequeñas cantidades de argón, dióxido de carbono y vapor de agua. El tiempo ocurre en su capa más baja, la troposfera.")}
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M40 70 V36" stroke="#6E4A2C" stroke-width="5"/><circle cx="40" cy="28" r="18" fill="#3E9A62"/><circle cx="26" cy="38" r="10" fill="#4FB074"/><circle cx="54" cy="38" r="10" fill="#4FB074"/></svg>`,"Biosfera","Todos los seres vivos, desde las bacterias hasta las personas, y los lugares donde viven. La vida existe en las otras esferas: el suelo, el agua y el aire.")}
    </div>
    <h3>Las esferas en acción</h3>
    <div class="chain">
      <div><b>Un huracán</b><p>El agua cálida del océano se evapora al aire (hidrosfera → atmósfera) y alimenta la tormenta. Los vientos y la marejada erosionan las playas (atmósfera → geosfera) y dañan los manglares y los arrecifes (→ biosfera).</p></div>
      <div><b>Las plantas respiran</b><p>Las plantas toman dióxido de carbono y sueltan oxígeno y vapor de agua (biosfera ↔ atmósfera), y sus raíces sacan agua del suelo (geosfera, hidrosfera).</p></div>
      <div><b>Las cuevas de Florida</b><p>El dióxido de carbono del aire se disuelve en el agua de lluvia (atmósfera → hidrosfera), y esa agua ácida disuelve la caliza (→ geosfera).</p></div>
      <div><b>Una erupción volcánica</b><p>La ceniza y los gases salen disparados al aire (geosfera → atmósfera), pueden tapar la luz del sol y enfriar el clima, y afectan los cultivos y los animales (→ biosfera).</p></div>
      <div><b>Capas de hielo que se derriten</b><p>El hielo derretido agrega agua al océano (criosfera → hidrosfera), sube el nivel del mar y cambia la forma de las costas (→ geosfera).</p></div>
      <div><b>Nidos de tortugas marinas</b><p>La temperatura de la arena de la playa (geosfera) decide si las tortuguitas (biosfera) nacen machos o hembras: la arena más caliente produce más hembras.</p></div>
    </div>`
  }
},

"sun-energy": {
  title: "The Sun’s energy & heat transfer",
  blurb: "Radiation, conduction, and convection drive weather and Earth’s spheres",
  icon: ART.sunIcon,
  body: () => `${HERO.sun()}
    <h2>The Sun’s energy & heat transfer</h2>
    <p class="intro">Almost all the energy that drives weather comes from the Sun. That energy moves around the Earth system in three ways: <b>radiation</b>, <b>conduction</b>, and <b>convection</b>.</p>
    <div class="tiles">
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="20" cy="22" r="13" fill="#F4B860"/>${waveRay(32,30,38,4)}</svg>`,"Radiation","Energy traveling as electromagnetic waves, like sunlight. It needs no matter, so it crosses empty space. Earth’s warmed surface also gives off infrared radiation.","no contact needed")}
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="6" y="50" width="68" height="20" rx="3" fill="#C9A66B"/><rect x="6" y="40" width="68" height="10" fill="#FF6B6B" opacity=".45"/><path d="M20 38 v-10 M40 38 v-10 M60 38 v-10" stroke="#FF6B6B" stroke-width="2.4" stroke-linecap="round"/></svg>`,"Conduction","Heat passing directly between things that touch. Hot sand heats the thin layer of air right above it. Air conducts heat poorly, so this only warms the lowest air.","direct contact")}
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M24 64 C14 44 34 30 24 12" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/><path d="M56 12 C66 32 46 46 56 64" fill="none" stroke="#5AA9FF" stroke-width="3" stroke-linecap="round"/><path d="M24 12 Q40 2 56 12 M56 64 Q40 74 24 64" fill="none" stroke="#97A9BF" stroke-width="2" stroke-dasharray="3 3"/></svg>`,"Convection","Heat carried by a moving fluid (liquid or gas). Warm air is less dense and rises; cool air sinks to replace it, forming a loop called a convection current.","rising & sinking")}
    </div>
    <h3>Uneven heating drives the weather</h3>
    <p>Sunlight hits the equator almost straight on but strikes the poles at a low angle, spreading the same energy over more area. The tropics gain more energy than they lose, and the poles lose more than they gain. Winds and ocean currents constantly carry heat from the equator toward the poles. That movement is our weather.</p>
    <h3>Land vs. water</h3>
    <p>Water has a high <b>specific heat</b>: it takes a lot of energy to warm it up, so oceans heat and cool slowly. Land heats up quickly. On a sunny Florida day the land gets hotter than the ocean, warm air over land rises, and cooler ocean air rushes in as a <b>sea breeze</b>. When the Gulf and Atlantic sea breezes collide over the peninsula, they force air upward and trigger Florida’s afternoon thunderstorms.</p>
    <h3>Two more key ideas</h3>
    <div class="defs">
      ${def("Albedo","how much sunlight a surface reflects. Fresh snow reflects up to about 90%, the dark ocean less than 10%. Earth overall reflects about 30%.")}
      ${def("Latent heat","energy stored when water evaporates and released when vapor condenses into clouds. This hidden heat powers thunderstorms and hurricanes.")}
    </div>
    <h3>How the Sun’s energy reaches every sphere</h3>
    <div class="chain">
      <div><b>Atmosphere</b><p>Uneven heating creates pressure differences, winds, fronts, and storms.</p></div>
      <div><b>Hydrosphere</b><p>Sunlight evaporates water to run the water cycle and warms the ocean surface, driving currents.</p></div>
      <div><b>Cryosphere</b><p>Absorbed energy melts snow and ice; less ice means more sunlight absorbed.</p></div>
      <div><b>Biosphere</b><p>Plants capture sunlight through photosynthesis, the energy source for nearly every food chain.</p></div>
      <div><b>Geosphere</b><p>Heating and cooling, along with water and wind, weather and erode rock. (Plate movement is driven by Earth’s internal heat, not the Sun.)</p></div>
    </div>`,
  es: {
    title: "La energía del Sol y la transferencia de calor",
    blurb: "La radiación, la conducción y la convección mueven el tiempo y las esferas de la Tierra",
    body: () => `${HERO.sun()}
    <h2>La energía del Sol y la transferencia de calor</h2>
    <p class="intro">Casi toda la energía que mueve el tiempo viene del Sol. Esa energía se mueve por el sistema de la Tierra de tres maneras: <b>radiación</b>, <b>conducción</b> y <b>convección</b>.</p>
    <div class="tiles">
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="20" cy="22" r="13" fill="#F4B860"/>${waveRay(32,30,38,4)}</svg>`,"Radiación","Energía que viaja en ondas electromagnéticas, como la luz del sol. No necesita materia, así que cruza el espacio vacío. La superficie caliente de la Tierra también suelta radiación infrarroja.","sin contacto")}
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="6" y="50" width="68" height="20" rx="3" fill="#C9A66B"/><rect x="6" y="40" width="68" height="10" fill="#FF6B6B" opacity=".45"/><path d="M20 38 v-10 M40 38 v-10 M60 38 v-10" stroke="#FF6B6B" stroke-width="2.4" stroke-linecap="round"/></svg>`,"Conducción","Calor que pasa directo entre cosas que se tocan. La arena caliente calienta la capa delgada de aire justo encima. El aire conduce mal el calor, así que esto solo calienta el aire más bajo.","contacto directo")}
      ${tile(`<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M24 64 C14 44 34 30 24 12" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/><path d="M56 12 C66 32 46 46 56 64" fill="none" stroke="#5AA9FF" stroke-width="3" stroke-linecap="round"/><path d="M24 12 Q40 2 56 12 M56 64 Q40 74 24 64" fill="none" stroke="#97A9BF" stroke-width="2" stroke-dasharray="3 3"/></svg>`,"Convección","Calor que lleva un fluido en movimiento (líquido o gas). El aire cálido es menos denso y sube; el aire frío baja para reemplazarlo y forma un ciclo llamado corriente de convección.","sube y baja")}
    </div>
    <h3>El calentamiento desigual mueve el tiempo</h3>
    <p>La luz del sol llega casi directo al ecuador, pero llega inclinada a los polos y reparte la misma energía en más área. Los trópicos ganan más energía de la que pierden, y los polos pierden más de la que ganan. Los vientos y las corrientes del océano llevan calor todo el tiempo del ecuador hacia los polos. Ese movimiento es nuestro tiempo.</p>
    <h3>Tierra contra agua</h3>
    <p>El agua tiene un <b>calor específico</b> alto: se necesita mucha energía para calentarla, así que los océanos se calientan y se enfrían despacio. La tierra se calienta rápido. En un día soleado en Florida, la tierra se pone más caliente que el océano, el aire cálido sobre la tierra sube y el aire más fresco del océano entra como <b>brisa marina</b>. Cuando las brisas del Golfo y del Atlántico chocan sobre la península, empujan el aire hacia arriba y provocan las tormentas de la tarde en Florida.</p>
    <h3>Dos ideas clave más</h3>
    <div class="defs">
      ${def("Albedo","cuánta luz del sol refleja una superficie. La nieve fresca refleja hasta cerca del 90%, el océano oscuro menos del 10%. La Tierra en total refleja cerca del 30%.")}
      ${def("Calor latente","energía que se guarda cuando el agua se evapora y se suelta cuando el vapor se condensa en nubes. Este calor escondido alimenta las tormentas eléctricas y los huracanes.")}
    </div>
    <h3>Cómo la energía del Sol llega a cada esfera</h3>
    <div class="chain">
      <div><b>Atmósfera</b><p>El calentamiento desigual crea diferencias de presión, vientos, frentes y tormentas.</p></div>
      <div><b>Hidrosfera</b><p>La luz del sol evapora el agua para mover el ciclo del agua y calienta la superficie del océano, lo que mueve las corrientes.</p></div>
      <div><b>Criosfera</b><p>La energía absorbida derrite la nieve y el hielo; menos hielo significa que se absorbe más luz del sol.</p></div>
      <div><b>Biosfera</b><p>Las plantas captan la luz del sol con la fotosíntesis, la fuente de energía de casi todas las cadenas alimenticias.</p></div>
      <div><b>Geosfera</b><p>El calentamiento y el enfriamiento, junto con el agua y el viento, desgastan y erosionan las rocas. (El movimiento de las placas viene del calor interno de la Tierra, no del Sol.)</p></div>
    </div>`
  }
},
