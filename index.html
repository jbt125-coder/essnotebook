"proxy-indicators": {
  title: "Proxy indicators",
  blurb: "How scientists read past climates from ice, trees, mud, and more",
  icon: ART.treeRings,
  body: () => `${HERO.proxy()}
    <h2>Proxy indicators</h2>
    <p class="intro">A <b>proxy</b> is something that stands in for something else. Nobody can go back in time and read a thermometer, so scientists use natural records that were shaped by past climate. These are called <b>proxy indicators</b>, or climate proxies.</p>
    <h3>How do they work?</h3>
    <p>Many proxies build up in layers over time, often one layer per year. Each layer traps clues about the conditions when it formed. Count the layers to find the age, then study each layer to read the climate.</p>
    <h3>Common proxy indicators</h3>
    <div class="tiles">
      ${tile(ART.iceCore,"Ice cores","Air bubbles trapped in the ice are samples of ancient atmosphere. The ice itself records past temperatures.","Up to ~800,000 years")}
      ${tile(ART.treeRings,"Tree rings","A tree adds one ring per year. Wide rings mean good growing years; narrow rings point to drought or cold.","Thousands of years")}
      ${tile(ART.sediment,"Sediment cores","Mud piles up on ocean and lake floors, trapping shells of tiny organisms whose chemistry records water temperature.","Millions of years")}
      ${tile(ART.soil,"Soil cores","Soil layers, colors, and buried plant material show whether an area was wetter or drier in the past.","Thousands of years")}
      ${tile(ART.coral,"Corals","Corals add a growth band each year. The chemistry of each band records past ocean temperature.","Hundreds of years")}
      ${tile(ART.pollen,"Pollen","Pollen preserved in lake mud shows which plants grew nearby, and the plants reveal the climate.","Tens of thousands of years")}
      ${tile(ART.cave,"Cave formations","Stalagmites grow in thin layers from dripping water, recording past rainfall and temperature.","Hundreds of thousands of years")}
      ${tile(ART.records,"Historical records","Diaries, ship logs, and harvest dates describe weather people saw before thermometers were common.","Hundreds of years")}
    </div>
    <div class="callout"><p><strong>Stronger together.</strong> No single proxy tells the whole story. When ice cores, tree rings, and sediments all point to the same change, scientists can be confident it really happened.</p></div>
    <h3>Words to know</h3>
    <div class="defs">
      ${def("Proxy","a natural record used in place of direct measurements.")}
      ${def("Core sample","a long cylinder drilled out of ice, mud, rock, or soil so its layers can be studied in order.")}
      ${def("Annual layer","a layer that forms once per year, like a tree ring.")}
    </div>`,
  es: {
    title: "Indicadores indirectos (proxies)",
    blurb: "Cómo los científicos leen los climas del pasado en el hielo, los árboles, el lodo y más",
    body: () => `${HERO.proxy()}
    <h2>Indicadores indirectos (proxies)</h2>
    <p class="intro">Un <b>proxy</b> es algo que toma el lugar de otra cosa. Nadie puede regresar en el tiempo y leer un termómetro, así que los científicos usan registros naturales que se formaron con el clima del pasado. Se llaman <b>indicadores indirectos</b>, o proxies del clima.</p>
    <h3>¿Cómo funcionan?</h3>
    <p>Muchos indicadores se forman en capas con el tiempo, a menudo una capa por año. Cada capa atrapa pistas de las condiciones cuando se formó. Cuenta las capas para saber la edad y luego estudia cada capa para leer el clima.</p>
    <h3>Indicadores indirectos comunes</h3>
    <div class="tiles">
      ${tile(ART.iceCore,"Núcleos de hielo","Las burbujas de aire atrapadas en el hielo son muestras de la atmósfera antigua. El hielo mismo guarda las temperaturas del pasado.","Hasta ~800,000 años")}
      ${tile(ART.treeRings,"Anillos de los árboles","Un árbol forma un anillo cada año. Los anillos anchos significan buenos años para crecer; los angostos señalan sequía o frío.","Miles de años")}
      ${tile(ART.sediment,"Núcleos de sedimento","El lodo se acumula en el fondo de océanos y lagos y atrapa conchas de organismos diminutos cuya química guarda la temperatura del agua.","Millones de años")}
      ${tile(ART.soil,"Núcleos de suelo","Las capas, los colores y los restos de plantas enterrados en el suelo muestran si una zona era más húmeda o más seca en el pasado.","Miles de años")}
      ${tile(ART.coral,"Corales","Los corales forman una banda de crecimiento cada año. La química de cada banda guarda la temperatura del océano en el pasado.","Cientos de años")}
      ${tile(ART.pollen,"Polen","El polen guardado en el lodo de los lagos muestra qué plantas crecían cerca, y las plantas revelan el clima.","Decenas de miles de años")}
      ${tile(ART.cave,"Formaciones de cuevas","Las estalagmitas crecen en capas delgadas por el agua que gotea y guardan la lluvia y la temperatura del pasado.","Cientos de miles de años")}
      ${tile(ART.records,"Registros históricos","Diarios, bitácoras de barcos y fechas de cosecha describen el tiempo que la gente vio antes de que los termómetros fueran comunes.","Cientos de años")}
    </div>
    <div class="callout"><p><strong>Más fuertes juntos.</strong> Ningún indicador cuenta toda la historia. Cuando los núcleos de hielo, los anillos de los árboles y los sedimentos señalan el mismo cambio, los científicos pueden confiar en que de verdad pasó.</p></div>
    <h3>Palabras que debes saber</h3>
    <div class="defs">
      ${def("Indicador indirecto (proxy)","un registro natural que se usa en lugar de mediciones directas.")}
      ${def("Muestra de núcleo","un cilindro largo que se saca perforando hielo, lodo, roca o suelo para estudiar sus capas en orden.")}
      ${def("Capa anual","una capa que se forma una vez al año, como un anillo de árbol.")}
    </div>`
  }
},

"ice-ages": {
  title: "Ice ages",
  blurb: "Why Earth swings between giant ice sheets and warm spells",
  icon: ART.snow,
  body: () => `${HERO.ice()}
    <h2>Ice ages</h2>
    <p class="intro">An <b>ice age</b> is a long stretch of time when Earth’s climate is cold enough for huge ice sheets to cover large parts of the continents.</p>
    <div class="defs">
      ${def("Glacial period","a cold stretch when ice sheets grow and spread.")}
      ${def("Interglacial period","a warmer stretch when ice sheets melt back.")}
    </div>
    <p>Right now we live in a warm interglacial called the <b>Holocene</b>, which began about 11,700 years ago. Ice sheets still cover Greenland and Antarctica.</p>
    <h3>The last big freeze</h3>
    <p>About 20,000 years ago, ice up to 3 km (2 miles) thick covered most of Canada and the northern United States. So much water was locked up as ice that sea level was about 120 m (400 ft) lower than today.</p>
    <div class="callout"><p><strong>Florida during the ice age.</strong> With sea level that low, Florida’s Gulf coast stretched far out onto what is now sea floor, making the peninsula roughly twice as wide as it is today.</p></div>
    <h3>What causes ice ages?</h3>
    <p>Slow, repeating changes in Earth’s orbit change how sunlight reaches Earth. These are called <b>Milankovitch cycles</b>.</p>
    <div class="tiles">
      ${tile(ART.orbit,"Orbit shape","Earth’s path around the Sun stretches into an oval, then rounds out again. (Eccentricity)","~100,000 years")}
      ${tile(ART.tilt,"Tilt","The angle of Earth’s axis shifts between about 22° and 24.5°. (Obliquity)","~41,000 years")}
      ${tile(ART.wobble,"Wobble","Earth’s axis slowly circles like a spinning top. (Precession)","~26,000 years")}
    </div>
    <p style="margin-top:14px">Feedbacks make the swings bigger: bright ice reflects sunlight back to space, cooling Earth even more, and changes in carbon dioxide strengthen both warming and cooling.</p>
    <h3>How do we know?</h3>
    <p>Proxy indicators! Ice cores and ocean sediment cores record the rhythm of glacial cycles, and landforms like moraines and scratched bedrock show where glaciers once flowed.</p>`,
  es: {
    title: "Edades de hielo",
    blurb: "Por qué la Tierra pasa de capas de hielo gigantes a épocas cálidas",
    body: () => `${HERO.ice()}
    <h2>Edades de hielo</h2>
    <p class="intro">Una <b>edad de hielo</b> es un periodo largo en el que el clima de la Tierra es tan frío que enormes capas de hielo cubren grandes partes de los continentes.</p>
    <div class="defs">
      ${def("Periodo glacial","un periodo frío en el que las capas de hielo crecen y se extienden.")}
      ${def("Periodo interglacial","un periodo más cálido en el que las capas de hielo se derriten y retroceden.")}
    </div>
    <p>Ahora vivimos en un interglacial cálido llamado el <b>Holoceno</b>, que empezó hace unos 11,700 años. Todavía hay capas de hielo sobre Groenlandia y la Antártida.</p>
    <h3>La última gran congelación</h3>
    <p>Hace unos 20,000 años, hielo de hasta 3 km (2 millas) de grosor cubría casi todo Canadá y el norte de Estados Unidos. Había tanta agua guardada como hielo que el nivel del mar estaba unos 120 m (400 pies) más bajo que hoy.</p>
    <div class="callout"><p><strong>Florida durante la edad de hielo.</strong> Con el nivel del mar tan bajo, la costa del Golfo de Florida llegaba mucho más lejos, sobre lo que hoy es fondo marino, y la península era casi el doble de ancha que hoy.</p></div>
    <h3>¿Qué causa las edades de hielo?</h3>
    <p>Cambios lentos y repetidos en la órbita de la Tierra cambian cómo llega la luz del sol a la Tierra. Se llaman <b>ciclos de Milankovitch</b>.</p>
    <div class="tiles">
      ${tile(ART.orbit,"Forma de la órbita","El camino de la Tierra alrededor del Sol se estira en un óvalo y luego se vuelve más redondo. (Excentricidad)","~100,000 años")}
      ${tile(ART.tilt,"Inclinación","El ángulo del eje de la Tierra cambia entre unos 22° y 24.5°. (Oblicuidad)","~41,000 años")}
      ${tile(ART.wobble,"Bamboleo","El eje de la Tierra da vueltas despacio, como un trompo. (Precesión)","~26,000 años")}
    </div>
    <p style="margin-top:14px">Las retroalimentaciones hacen más grandes los cambios: el hielo brillante refleja la luz del sol al espacio y enfría todavía más la Tierra, y los cambios en el dióxido de carbono refuerzan tanto el calentamiento como el enfriamiento.</p>
    <h3>¿Cómo lo sabemos?</h3>
    <p>¡Con indicadores indirectos! Los núcleos de hielo y los núcleos de sedimento del océano guardan el ritmo de los ciclos glaciales, y formas del terreno como las morrenas y la roca rayada muestran por dónde pasaron los glaciares.</p>`
  }
},

"climate-vs-weather": {
  title: "Climate vs. weather",
  blurb: "Same atmosphere, different time scales",
  icon: ART.sky,
  body: () => `${HERO.climate()}
    <h2>Climate vs. weather</h2>
    <p class="intro">Weather and climate both describe the atmosphere. The difference is <b>time</b>.</p>
    <div class="compare">
      <div><h4 style="color:var(--amber)">Weather</h4><p class="when">Conditions right now or over a few days</p>
        <ul><li>A thunderstorm rolls in at 3 p.m. today</li><li>Tomorrow’s high is 91°F</li><li>A cold front drops it to 48°F one January morning</li></ul></div>
      <div><h4 style="color:var(--ice)">Climate</h4><p class="when">The average pattern over 30 years or more</p>
        <ul><li>Florida has a wet season from about May to October</li><li>Summers are hot and humid</li><li>South Florida winters are mild</li></ul></div>
    </div>
    <div class="callout big"><p>Climate is what you expect. Weather is what you get.</p></div>
    <h3>What gets measured</h3>
    <p>Both use the same ingredients. Weather looks at them today; climate averages them over decades.</p>
    <div class="chips"><span>Temperature</span><span>Precipitation</span><span>Humidity</span><span>Wind</span><span>Air pressure</span><span>Cloud cover</span></div>
    <h3>What shapes a place’s climate</h3>
    <div class="defs">
      ${def("Latitude","places closer to the equator get more direct sunlight.")}
      ${def("Nearness to water","oceans heat and cool slowly, keeping coasts milder.")}
      ${def("Ocean currents","warm currents like the Gulf Stream carry heat along coastlines.")}
      ${def("Elevation","higher places are usually cooler.")}
      ${def("Prevailing winds","winds bring moist or dry air from other regions.")}
    </div>
    <div class="callout"><p><strong>Watch out.</strong> One cold week doesn’t mean the climate is cooling, and one hot day doesn’t prove it’s warming. Climate shows up in long-term averages.</p></div>`,
  es: {

    blurb: "La misma atmósfera, distintas escalas de tiempo",
    body: () => `${HERO.climate()}

    <div class="compare">
      <div><h4 style="color:var(--amber)">Tiempo atmosférico</h4><p class="when">Las condiciones de ahora o de unos pocos días</p>
        <ul><li>Llega una tormenta eléctrica hoy a las 3 p. m.</li><li>La máxima de mañana es 91 °F</li><li>Un frente frío la baja a 48 °F una mañana de enero</li></ul></div>
      <div><h4 style="color:var(--ice)">Clima</h4><p class="when">El patrón promedio de 30 años o más</p>
        <ul><li>Florida tiene una temporada de lluvias más o menos de mayo a octubre</li><li>Los veranos son calientes y húmedos</li><li>Los inviernos del sur de Florida son templados</li></ul></div>
    </div>
    <div class="callout big"><p>El clima es lo que esperas. El tiempo es lo que te toca.</p></div>
    <h3>Qué se mide</h3>

    <div class="chips"><span>Temperatura</span><span>Precipitación</span><span>Humedad</span><span>Viento</span><span>Presión del aire</span><span>Nubosidad</span></div>
    <h3>Qué determina el clima de un lugar</h3>
    <div class="defs">
      ${def("Latitud","los lugares más cerca del ecuador reciben luz del sol más directa.")}
      ${def("Cercanía al agua","los océanos se calientan y se enfrían despacio, así que las costas son más templadas.")}
      ${def("Corrientes del océano","las corrientes cálidas como la del Golfo llevan calor a lo largo de las costas.")}
      ${def("Altitud","los lugares más altos suelen ser más fríos.")}
      ${def("Vientos predominantes","los vientos traen aire húmedo o seco de otras regiones.")}
    </div>
    <div class="callout"><p><strong>Cuidado.</strong> Una semana fría no significa que el clima se esté enfriando, y un día caliente no prueba que se esté calentando. El clima se ve en los promedios a largo plazo.</p></div>`

/* =========================================================
   VIEWS + ROUTING   #  |  #q1  |  #q1/water-cycle
   ========================================================= */
function $(s){ return document.querySelector(s); }
const views = { title: $("#title"), toc: $("#toc"), card: $("#cardView") };
function show(name){ for (const k in views) views[k].classList.toggle("on", k === name); window.scrollTo(0, 0); }
function go(hash){ if (location.hash.replace(/^#/,"") === hash) route(); else location.hash = hash ? "#" + hash : ""; if (!hash) route(); }
/* a card in the current language: Spanish cards keep their text in card.es */
function cardL(id){ const c = CARDS[id]; return LANG === "es" && c.es ? c.es : c; }
function cardTitle(id){ return cardL(id).title; }
function hasTopics(q){ return (TEACHER_ORDER[q] || []).some(id => CARDS[id]); }

function route(){
  const [q, id] = location.hash.replace(/^#/, "").split("/");
  if (TEACHER_ORDER[q] && hasTopics(q)){
    if (id && CARDS[id] && TEACHER_ORDER[q].includes(id)) return openCard(q, id);
    return openToc(q);
  }
  show("title");
}

let currentQ = null;
function openToc(q){
  currentQ = q;
  const order = getOrder(q);
  $("#tocCrumb").textContent = qName(q);
  $("#tocTitle").textContent = T(qName(q) + " contents", "Contenido del " + qName(q).toLowerCase());
  const list = $("#tocList");
  list.dataset.q = q;
  list.innerHTML = order.map(id => {
    const c = CARDS[id], done = isDone(q + "." + id);
    return `<li data-id="${id}"><button data-card="${id}">${c.icon}<span><h3>${cardTitle(id)}</h3><p>${cardL(id).blurb}</p></span><span class="status ${done?'done':''}">${done ? T("✓ Done", "✓ Listo") : T("New", "Nuevo")}</span></button></li>`;
  }).join("");
  const n = order.filter(id => isDone(q + "." + id)).length;
  $("#tocProgress").textContent = n ? T(`${n} of ${order.length} topics explored`, `${n} de ${order.length} temas explorados`) : T("Pick a topic to start.", "Elige un tema para empezar.");
  $("#meterFill").style.width = (n / order.length * 100) + "%";
  $("#resetOrder").hidden = !Array.isArray(save.order[q]);
  show("toc");
}

let currentCard = null;
function openCard(q, id){
  currentQ = q; currentCard = id;
  $("#cardCrumb").textContent = qName(q);
  $("#cardBack").dataset.go = q;
  $("#cardBody").innerHTML = cardL(id).body();
  show("card");
}

/* =========================================================
   DRAG TO REORDER (press and hold, then drag)
   ========================================================= */
let drag = null, suppressClick = false;
const tocList = $("#tocList");

function startPress(li, x, y){
  cancelPress();
  drag = { li, x0: x, y0: y, y, active: false };
  drag.timer = setTimeout(activateDrag, 350);
}
function cancelPress(){ if (drag){ clearTimeout(drag.timer); if (!drag.active) drag = null; } }
function activateDrag(){
  if (!drag) return;
  drag.active = true;
  const r = drag.li.getBoundingClientRect();
  drag.grab = drag.y - r.top;
  drag.li.classList.add("lifted");
  document.body.classList.add("dragging");
  if (navigator.vibrate) navigator.vibrate(15);
  positionDrag();
  requestAnimationFrame(autoScroll);
}
function moveDrag(x, y, e){
  if (!drag) return;
  drag.y = y;
  if (!drag.active){ if (Math.hypot(x - drag.x0, y - drag.y0) > 10) cancelPress(); return; }
  if (e && e.cancelable) e.preventDefault();
  positionDrag();
}
function positionDrag(){
  const li = drag.li, target = drag.y - drag.grab, mid = drag.y;
  let before = null;
  for (const n of tocList.children){
    if (n === li) continue;
    const r = n.getBoundingClientRect();
    if (mid < r.top + r.height / 2){ before = n; break; }
  }
  if (before !== li.nextElementSibling) tocList.insertBefore(li, before);
  const natural = tocList.getBoundingClientRect().top + li.offsetTop;
  li.style.transform = `translateY(${target - natural}px)`;
}
function autoScroll(){
  if (!drag || !drag.active) return;
  const edge = 70;
  if (drag.y < edge) { window.scrollBy(0, -8); positionDrag(); }
  else if (drag.y > window.innerHeight - edge) { window.scrollBy(0, 8); positionDrag(); }
  requestAnimationFrame(autoScroll);
}
function endPress(){
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.active){
    drag.li.style.transform = "";
    drag.li.classList.remove("lifted");
    document.body.classList.remove("dragging");
    const q = tocList.dataset.q;
    save.order[q] = [...tocList.children].map(n => n.dataset.id);
    writeSave();
    $("#resetOrder").hidden = false;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 400);
  }
  drag = null;
}
tocList.addEventListener("touchstart", e => { const li = e.target.closest("li"); if (li){ const t = e.touches[0]; startPress(li, t.clientX, t.clientY); } }, { passive: true });
tocList.addEventListener("mousedown", e => { if (e.button !== 0) return; const li = e.target.closest("li"); if (li) startPress(li, e.clientX, e.clientY); });
tocList.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (drag){ const t = e.touches[0]; moveDrag(t.clientX, t.clientY, e); } }, { passive: false });
document.addEventListener("mousemove", e => { if (drag) moveDrag(e.clientX, e.clientY, e); });
document.addEventListener("touchend", endPress);
document.addEventListener("touchcancel", endPress);
document.addEventListener("mouseup", endPress);
document.addEventListener("click", e => { if (suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

$("#resetOrder").addEventListener("click", () => {
  delete save.order[currentQ]; writeSave(); openToc(currentQ);
});

/* o.tall: scrolls when taller than the screen; o.locked: can't be closed by tapping outside (first-time sign in) */
let sheetLocked = false;
function openSheet(html, o = {}){
  sheetLocked = !!o.locked;
  const sh = $("#sheet");

}

$("#scrim").addEventListener("click", e => { if ((e.target.id === "scrim" && !sheetLocked) || e.target.dataset.close !== undefined) closeSheet(); });

/* =========================================================
   REVIEW QUESTIONS
   Built-in starter questions (STARTER_TEXT, below the cards) plus any
   pasted in through the cog. Both use the same labeled format:
     Topic: fronts
     Question: ...   A: ...  B: ...  C: ...  D: ...   Answer: B
     Pregunta: ...   A: ...  B: ...  C: ...  D: ...   (same order)
   ========================================================= */
const LAUNCH_KEY = "essNotebook.launch";
function normKey(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }
function findTopic(label){
  const tries = [label, label.split("(")[0], label.split(/\s[-–—]\s/)[0], label.split(":")[0]];
  for (const tr of tries){
    const k = normKey(tr); if (!k) continue;
    for (const id in CARDS){
      const c = CARDS[id];
      if (normKey(id) === k || normKey(c.title) === k || (c.es && normKey(c.es.title) === k)) return id;
    }
  }
  return null;
}
/* one language's part of a question: text, then A: B: C: D: choices, then an optional Answer: letter */
function parseSection(body){
  const ans = body.match(/(?:^|[\s,;])(?:correct\s+)?(?:answer|respuesta(?:\s+correcta)?)\s*[:.\-]?\s*\(?([A-E])\b/i);
  let a = -1;
  if (ans){ a = ans[1].toUpperCase().charCodeAt(0) - 65; body = body.slice(0, ans.index); }
  const re = /(^|[\s,;])([A-E])\s*[:.)]\s+/g, marks = [];
  let m;
  while ((m = re.exec(body))) if (m[2].charCodeAt(0) - 65 === marks.length) marks.push({ at: m.index + m[1].length, textAt: re.lastIndex });
  const tidy = x => x.replace(/\s+/g, " ").replace(/[\s,;]+$/, "").trim();
  const q = tidy(marks.length ? body.slice(0, marks[0].at) : body);
  const c = marks.map((mk, i) => tidy(body.slice(mk.textAt, i + 1 < marks.length ? marks[i + 1].at : body.length)));
  return { q, c, a };
}
function parseBank(text){
  const out = [], problems = [], unknown = [];
  let tp = null, label = "", cur = null;
  const finish = () => {
    if (!cur) return;
    const en = parseSection(cur.en), short = cur.en.trim().split("\n")[0].slice(0, 70);
    if (!cur.tp){ if (!cur.label) problems.push(short + T(" (no Topic: line)", " (falta la línea Topic:)")); }
    else if (!en.q || en.c.length < 2 || en.c.some(x => !x) || en.a < 0 || en.a >= en.c.length) problems.push(short);
    else {
      const q = { tp: cur.tp, q: en.q, c: en.c, a: en.a };
      if (cur.es != null){ const es = parseSection(cur.es); if (es.q && es.c.length === en.c.length && es.c.every(x => x)) q.es = { q: es.q, c: es.c }; }
      out.push(q);
    }
    cur = null;
  };
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  for (let line of lines){
    line = line.replace(/\*\*|__/g, "").replace(/\\([*_`#\[\]()\-.!>+~|?:])/g, "$1").replace(/^\s*(?:#+|>|[-*•])\s*/, "").replace(/^\s*\d+\s*[.)]\s+(?=(?:topic|tema|question|pregunta)\b)/i, "");
    let m;
    if ((m = line.match(/^\s*(?:topic|tema)\s*[:.\-]\s*(.+)$/i))){
      finish(); label = m[1].trim(); tp = findTopic(label);
      if (!tp && !unknown.includes(label)) unknown.push(label);
    } else if ((m = line.match(/^\s*(?:question|q)\s*\d*\s*[:.)\-]\s*(.*)$/i))){
      finish(); cur = { tp, label: tp ? "" : label, en: m[1], es: null };
    } else if ((m = line.match(/^\s*pregunta\s*\d*\s*[:.)\-]\s*(.*)$/i))){
      if (cur && cur.es == null) cur.es = m[1];
    } else if (cur){
      if (cur.es != null) cur.es += "\n" + line; else cur.en += "\n" + line;
    }
  }
  finish();
  return { questions: out, problems, unknown };
}
const qKey = q => q.tp + "|" + normKey(q.q);
let STARTER_Q = [];
function allQuestions(){ return STARTER_Q.concat(save.addedQ); }
function countsBy(list){ const n = {}; list.forEach(q => { n[q.tp] = (n[q.tp] || 0) + 1; }); return n; }

/* topic buttons, grouped by quarter; the student taps to highlight */
function topicPicker(selected, counts, opt){
  return ["q1", "q2", "q3", "q4"].map(q => {
    const ids = hasTopics(q) ? getOrder(q) : [];
    const chips = ids.length ? ids.map(id => {
      const n = counts[id] || 0, off = opt.needQ && !n;
      return `<button type="button" class="tchip" data-tp="${id}" aria-pressed="${selected.has(id)}"${off ? " disabled" : ""}>${esc(cardTitle(id))}${opt.showCount ? `<small>${n}</small>` : ""}</button>`;
    }).join("") : `<p class="small" style="margin:0">${T("No topics yet.", "Todavía no hay temas.")}</p>`;
    return `<div class="qgroup" data-q="${q}"><div class="qgroup-head"><b>${qName(q)}</b>${ids.length ? `<button type="button" class="linkish" data-allq="${q}"></button>` : ""}</div><div class="tchips">${chips}</div></div>`;
  }).join("");
}
function bindPicker(root, selected, onChange){
  const refresh = () => {
    root.querySelectorAll("[data-allq]").forEach(b => {
      const chips = [...root.querySelectorAll(`.qgroup[data-q="${b.dataset.allq}"] .tchip:not(:disabled)`)];
      b.textContent = chips.length && chips.every(x => selected.has(x.dataset.tp)) ? T("Clear", "Quitar") : T("Select all", "Elegir todos");
      b.hidden = !chips.length;
    });
    onChange();
  };
  root.addEventListener("click", e => {
    const c = e.target.closest(".tchip");
    if (c && !c.disabled){
      const id = c.dataset.tp;
      if (selected.has(id)) selected.delete(id); else selected.add(id);
      c.setAttribute("aria-pressed", selected.has(id));
      return refresh();
    }
    const a = e.target.closest("[data-allq]");
    if (a){
      const chips = [...root.querySelectorAll(`.qgroup[data-q="${a.dataset.allq}"] .tchip:not(:disabled)`)];
      const allOn = chips.every(x => selected.has(x.dataset.tp));
      chips.forEach(x => { if (allOn) selected.delete(x.dataset.tp); else selected.add(x.dataset.tp); x.setAttribute("aria-pressed", !allOn); });
      refresh();
    }
  });
  refresh();
}
function topicsInOrder(selected){ return ["q1", "q2", "q3", "q4"].flatMap(q => hasTopics(q) ? getOrder(q) : []).filter(id => selected.has(id)); }

/* =========================================================
   COG: add AI-written review questions (saved on this device)
   ========================================================= */
/* a topic's notes as plain text, for the AI prompt */
function cardText(id){
  const box = document.createElement("textarea");
  box.innerHTML = CARDS[id].body()
    .replace(/<figure[\s\S]*?<\/figure>/g, "").replace(/<svg[\s\S]*?<\/svg>/g, "")
    .replace(/<\/(td|th)>/g, " | ").replace(/<\/(p|div|h2|h3|h4|li|tr|figcaption|span)>/g, "\n")
    .replace(/<[^>]+>/g, "");
  return box.value.split("\n").map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n");
}
function aiPrompt(ids, per){
  return `You are writing multiple-choice review questions for a high school Earth Space Science class in Florida. The students' notes for each topic are at the end of this message. Base every question on those notes.

Write ${per} questions for EACH of these ${ids.length} topics (${per * ids.length} questions in all):
${ids.map(id => `- ${id}: ${CARDS[id].title}`).join("\n")}

Rules:
- Start every question with a Topic line that uses the exact topic label from the list above (the part before the colon).
- Each question has exactly 4 answer choices (A, B, C, D) and exactly one correct answer.
- Mix easy, medium, and hard questions. Include some that ask students to apply an idea, not just remember a word.
- Spread the correct answers evenly across A, B, C, and D.
- No "all of the above" or "none of the above".
- Keep questions and choices short enough to read on a phone.
- After each English question, write the same question in Spanish, with the choices in the SAME order.
- Use plain text only: no bold, no numbering, no bullet points, no headings, and no extra comments. Put a blank line between questions.

Example of the format (use it for every question):

Topic: water-cycle
Question: Which process turns liquid water into water vapor?
A: Condensation
B: Evaporation
C: Precipitation
D: Infiltration
Answer: B
Pregunta: ¿Qué proceso convierte el agua líquida en vapor de agua?
A: Condensación
B: Evaporación
C: Precipitación
D: Infiltración

If you run out of room, stop after a complete question. I will type "continue" and you keep going from where you stopped, in the same format.

STUDENT NOTES
${ids.map(id => `=== ${id}: ${CARDS[id].title} ===\n${cardText(id)}`).join("\n\n")}`;
}
function cogSheet(){
  const all = [...Object.keys(CARDS)].filter(id => Object.values(TEACHER_ORDER).some(l => l.includes(id)));
  const selected = new Set(all);
  openSheet(`<h3 id="sheetTitle">${T("Review questions", "Preguntas de repaso")}</h3>
    <p>${T("Add review questions written by AI. They are saved on this device only.", "Agrega preguntas de repaso escritas con IA. Se guardan solo en este aparato.")}</p>
    <ol class="steps">
      <li>${T("Pick the topics and how many questions you want for each.", "Elige los temas y cuántas preguntas quieres para cada uno.")}</li>
      <li>${T("Tap <b>Copy AI prompt</b> and paste it into an AI chat like ChatGPT, Gemini, or Claude.", "Toca <b>Copiar instrucciones</b> y pégalas en un chat de IA como ChatGPT, Gemini o Claude.")}</li>

    </ol>
    <span class="field">${T("Topics (the number is how many questions each has now)", "Temas (el número es cuántas preguntas tiene cada uno ahora)")}</span>
    <div id="cPick"></div>
    <label class="field" for="cPer">${T("Questions per topic", "Preguntas por tema")}</label>
    <input class="inp num" id="cPer" type="number" inputmode="numeric" min="1" max="50" value="${(save.game && save.game.perTopic) || 20}">
    <div class="row"><button class="btn" id="cCopy">${T("Copy AI prompt", "Copiar instrucciones")}</button></div>
    <p class="msg" id="cCopyMsg"></p>
    <textarea class="inp" id="cPromptBox" readonly hidden></textarea>
    <hr>
    <label class="field" for="cPaste">${T("Paste the AI’s questions here", "Pega aquí las preguntas de la IA")}</label>
    <textarea class="inp" id="cPaste" spellcheck="false" placeholder="Topic: water-cycle&#10;Question: …&#10;A: …&#10;B: …&#10;C: …&#10;D: …&#10;Answer: B&#10;Pregunta: …&#10;A: …"></textarea>
    <div class="row"><button class="btn" id="cAdd">${T("Add questions", "Agregar preguntas")}</button></div>
    <div class="msg" id="cAddMsg"></div>
    <hr>
    <p class="small" id="cTotal"></p>
    <div class="row"><button class="btn ghost" id="cClear">${T("Clear my added questions", "Borrar mis preguntas agregadas")}</button><button class="btn ghost" data-close>${T("Close", "Cerrar")}</button></div>`, { tall: true });
  const drawPick = () => {
    const box = $("#cPick"), fresh = box.cloneNode(false);
    box.replaceWith(fresh);
    fresh.innerHTML = topicPicker(selected, countsBy(allQuestions()), { needQ: false, showCount: true });
    bindPicker(fresh, selected, () => { $("#cCopy").disabled = !selected.size; });
    const added = save.addedQ.length;
    $("#cTotal").textContent = T(`${STARTER_Q.length} built-in questions + ${added} added on this device.`, `${STARTER_Q.length} preguntas incluidas + ${added} agregadas en este aparato.`);
    $("#cClear").disabled = !added;
  };
  drawPick();
  $("#cCopy").addEventListener("click", () => {
    const per = Math.min(50, Math.max(1, parseInt($("#cPer").value, 10) || 20));
    save.game = Object.assign(save.game || {}, { perTopic: per }); writeSave();
    const text = aiPrompt(topicsInOrder(selected), per), msg = $("#cCopyMsg"), box = $("#cPromptBox");
    const fallback = () => {
      box.value = text; box.hidden = false; box.focus(); box.select();
      msg.className = "msg warn"; msg.textContent = T("Couldn’t copy automatically. The prompt is selected in the box below: copy it yourself.", "No se pudo copiar solo. Las instrucciones están seleccionadas en el cuadro de abajo: cópialas tú.");
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => { box.hidden = true; msg.className = "msg"; msg.textContent = T("Copied! Paste it into an AI chat.", "¡Copiado! Pégalo en un chat de IA."); }, fallback);
    } else fallback();
  });
  $("#cAdd").addEventListener("click", () => {
    const r = parseBank($("#cPaste").value), seen = new Set(allQuestions().map(qKey)), fresh = [];
    let dup = 0;
    r.questions.forEach(q => { const k = qKey(q); if (seen.has(k)) dup++; else { seen.add(k); fresh.push(q); } });
    const noEs = fresh.filter(q => !q.es).length;
    save.addedQ = save.addedQ.concat(fresh); writeSave();
    const per = countsBy(fresh), msg = $("#cAddMsg");
    let html = fresh.length ? `<b>${T(`Added ${fresh.length} questions.`, `Se agregaron ${fresh.length} preguntas.`)}</b><ul>${topicsInOrder(new Set(Object.keys(per))).map(id => `<li>${esc(cardTitle(id))}: +${per[id]}</li>`).join("")}</ul>` : `<b>${T("No new questions were added.", "No se agregaron preguntas nuevas.")}</b>`;
    const warn = [];
    if (dup) warn.push(T(`${dup} skipped because they were already saved.`, `${dup} omitidas porque ya estaban guardadas.`));
    if (noEs) warn.push(T(`${noEs} have no Spanish version, so they show in English for everyone.`, `${noEs} no tienen versión en español, así que salen en inglés.`));
    if (r.unknown.length) warn.push(T("These Topic labels don’t match a notebook topic, so their questions were skipped: ", "Estas etiquetas de Topic no coinciden con ningún tema, así que se omitieron sus preguntas: ") + r.unknown.map(esc).join(", "));
    if (r.problems.length) warn.push(T(`${r.problems.length} couldn’t be read (each needs a question, A–D choices, and an Answer: letter):`, `${r.problems.length} no se pudieron leer (cada una necesita la pregunta, opciones A–D y una línea Answer:):`) + `<ul>${r.problems.slice(0, 5).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);
    if (warn.length) html += `<div class="msg warn">${warn.map(w => `<p style="margin:0 0 6px">${w}</p>`).join("")}</div>`;
    msg.className = "msg" + (fresh.length ? "" : " warn"); msg.innerHTML = html;
    if (fresh.length && !r.problems.length && !r.unknown.length) $("#cPaste").value = "";
    drawPick();
  });
  let clearArmed = null;
  $("#cClear").addEventListener("click", () => {
    const b = $("#cClear");
    if (!clearArmed){
      b.textContent = T(`Tap again to delete ${save.addedQ.length} questions`, `Toca otra vez para borrar ${save.addedQ.length} preguntas`);
      clearArmed = setTimeout(() => { clearArmed = null; b.textContent = T("Clear my added questions", "Borrar mis preguntas agregadas"); }, 4000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null;
    save.addedQ = []; writeSave();
    b.textContent = T("Clear my added questions", "Borrar mis preguntas agregadas");
    $("#cAddMsg").className = "msg"; $("#cAddMsg").textContent = T("Your added questions were deleted. The built-in questions are still here.", "Se borraron tus preguntas agregadas. Las preguntas incluidas siguen aquí.");
    drawPick();
  });
}

const sel = $("#quarter"), openBtn = $("#openQ");
if (save.lastQuarter){ sel.value = save.lastQuarter; openBtn.disabled = false; }
sel.addEventListener("change", () => { openBtn.disabled = !sel.value; });
openBtn.addEventListener("click", () => {
  const q = sel.value; if (!q) return;
  save.lastQuarter = q; writeSave();
  if (hasTopics(q)) go(q); else comingSoon(qName(q));
});
$("#saveCheckBtn").addEventListener("click", saveCheck);
$("#profileBtn").addEventListener("click", () => profileSheet(false));
$("#cogBtn").addEventListener("click", cogSheet);
const gameSel = $("#game"), playBtn = $("#playG");
gameSel.addEventListener("change", () => { playBtn.disabled = !gameSel.value; if (gameSel.value) gameSheet(gameSel.value); });
playBtn.addEventListener("click", () => { if (gameSel.value) gameSheet(gameSel.value); });
document.addEventListener("click", e => {
  const card = e.target.closest("[data-card]");
  if (card) return go(currentQ + "/" + card.dataset.card);
  const back = e.target.closest("[data-go]");
  if (back) return go(back.dataset.go);
});
$("#nextBtn").addEventListener("click", () => { if (currentCard) markDone(currentQ + "." + currentCard); go(currentQ); });
window.addEventListener("hashchange", route);

(function stars(){
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  let html = "";
  for (let i = 0; i < 80; i++){ const s = rnd() < .85 ? 1.5 : 2.5;
    html += `<span class="star${rnd() < .2 ? ' tw' : ''}" style="left:${rnd()*100}%;top:${rnd()*72}%;width:${s}px;height:${s}px;opacity:${.35 + rnd()*.6};animation-delay:${rnd()*4}s"></span>`; }
  $("#stars").innerHTML = html;
})();

STARTER_Q = parseBank(STARTER_TEXT).questions;
applyUI();
renderMeLine();
route();
if (!save.profile) profileSheet(true);
</script>
</body>
